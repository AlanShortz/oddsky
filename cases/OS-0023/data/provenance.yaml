gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(241.778721,-53.624783), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source
      WHERE 1=CONTAINS(POINT(ra,dec), CIRCLE(241.778721,-53.624783,0.008333333333333333)) ORDER BY sep_arcsec
  retrieved_at: '2026-10-31T03:02:32+00:00'
  rows_raw: 133
  rows_kept: 133
  cuts: []
  notes: []
  status: ok

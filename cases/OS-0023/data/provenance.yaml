neowise:
  archive: IRSA Gator neowiser_p1bs_psd
  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 241.778721 -53.624783
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-31T03:05:59+00:00'
  rows_raw: 272
  rows_kept: 42
  cuts:
  - 'W1: qual_frame > 0 removed 27'
  - 'W1: cc_flags[0] == ''0'' removed 93'
  - 'W1: nb == 1 (no blending) removed 7'
  - 'W1: w1rchi2 < 5x source median removed 1'
  - 'W2: qual_frame > 0 removed 27'
  - 'W2: cc_flags[1] == ''0'' removed 32'
  - 'W2: nb == 1 (no blending) removed 6'
  - 'W2: w2rchi2 < 5x source median removed 1'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

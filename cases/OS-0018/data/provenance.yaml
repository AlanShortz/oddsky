    ra: 271.603281
    dec: -9.069857
    mjd_min: 57000
    use_reduced: true
    task: '5272650'
  retrieved_at: '2026-10-30T15:23:19+00:00'
  rows_raw: 4583
  rows_kept: 4341
  cuts: []

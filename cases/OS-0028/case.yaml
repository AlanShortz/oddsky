id: OS-0028
title: 'A star in Sagittarius brightened briefly in March 2022 while OGLE was paused: a short microlensing
  candidate'
hook: Found blind in Oddsky hunt H-0008 (NEOWISE x2.2 on 2022 Mar 19). ATLAS shows a sharp, symmetric
  event peaking on 2022 Mar 25 and lasting about two weeks, the same in optical and infrared. OGLE was
  paused and the star is outside KMTNet's fields.

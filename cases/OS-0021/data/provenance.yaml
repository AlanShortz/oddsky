  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 262.961311 -44.763659
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-31T02:57:22+00:00'
  rows_raw: 304
  rows_kept: 42
  cuts:
  - 'W1: qual_frame > 0 removed 12'
  - 'W1: saa_sep > 0 removed 41'
  - 'W1: moon_masked == ''00'' removed 16'
  - 'W1: nb == 1 (no blending) removed 1'
  - 'W1: w1rchi2 < 5x source median removed 2'
  - 'W2: qual_frame > 0 removed 12'
  - 'W2: saa_sep > 0 removed 41'
  - 'W2: moon_masked == ''00'' removed 16'
  - 'W2: cc_flags[1] == ''0'' removed 1'
  - 'W2: ph_qual[1] in (A,B) removed 1'
  - 'W2: nb == 1 (no blending) removed 1'
  - 'W2: w2rchi2 < 5x source median removed 1'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

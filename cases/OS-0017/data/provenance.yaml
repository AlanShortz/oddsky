neowise:
  archive: IRSA Gator neowiser_p1bs_psd
  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 293.471115 -21.3037472
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-29T21:54:25+00:00'
  rows_raw: 268
  rows_kept: 40
  cuts:
  - 'W1: qual_frame > 0 removed 7'
  - 'W1: saa_sep > 0 removed 53'
  - 'W1: moon_masked == ''00'' removed 29'
  - 'W2: qual_frame > 0 removed 7'
  - 'W2: saa_sep > 0 removed 53'
  - 'W2: moon_masked == ''00'' removed 29'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

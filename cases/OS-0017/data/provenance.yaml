gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(293.471115,-21.3037472), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source
      WHERE 1=CONTAINS(POINT(ra,dec), CIRCLE(293.471115,-21.3037472,0.008333333333333333)) ORDER BY sep_arcsec
  retrieved_at: '2026-10-29T21:54:09+00:00'
  rows_raw: 11
  rows_kept: 11
  cuts: []
  notes: []
  status: ok

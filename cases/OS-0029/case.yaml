id: OS-0029
title: 'A star in Serpens brightened by half in March 2016, equally in Gaia''s three bands: a microlensing
  candidate'
hook: Found blind in Oddsky hunt H-0009 (NEOWISE x1.6 on 2016 Mar 21). Gaia DR3 epoch photometry shows
  x1.5 sixteen days earlier and x1.4 fifteen days later, equal in G, BP and RP, fading by late April.
  Gaia's classifier labels the star MICROLENSING.

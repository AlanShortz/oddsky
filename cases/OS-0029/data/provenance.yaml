gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(272.1663777,-15.3195869), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source
      WHERE 1=CONTAINS(POINT(ra,dec), CIRCLE(272.1663777,-15.3195869,0.008333333333333333)) ORDER BY sep_arcsec
  retrieved_at: '2026-11-01T02:28:44+00:00'
  rows_raw: 123
  rows_kept: 123
  cuts: []
  notes: []
  status: ok
gaia_epoch:
  archive: ESA Gaia epoch photometry (datalink; DR4 if published, else DR3)
  query:
    source_id: 4145977633638478336
    release_used: Gaia DR3
  retrieved_at: '2026-11-01T02:31:30+00:00'
  rows_raw: 82
  rows_kept: 81
  cuts: []
  notes:
  - 'Gaia DR4 request failed (RuntimeError: https://gea.esac.esa.int/data-server/data unavailable after
    1 attempts: 500); fell back to the next release'
  - epoch photometry from Gaia DR3

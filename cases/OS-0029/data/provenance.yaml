    dip can mean the dip itself
  status: ok
neowise:
  archive: IRSA Gator neowiser_p1bs_psd
  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 272.1663777 -15.3195869
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-11-01T02:31:40+00:00'
  rows_raw: 273
  rows_kept: 38
  cuts:
  - 'W1: qual_frame > 0 removed 4'
  - 'W1: saa_sep > 0 removed 42'
  - 'W1: moon_masked == ''00'' removed 25'
  - 'W1: nb == 1 (no blending) removed 166'
  - 'W2: qual_frame > 0 removed 4'
  - 'W2: saa_sep > 0 removed 42'
  - 'W2: moon_masked == ''00'' removed 25'
  - 'W2: nb == 1 (no blending) removed 166'
  - 'W2: w2rchi2 < 5x source median removed 1'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

  caption: "WISE (blue) and Spitzer/IRAC (red) brightness changes at 3.4/3.6 µm (top) and 4.6/4.5 µm (bottom). The curves are the fitted recurring outburst, with a period of about 10 years; vertical lines mark the fitted outburst times. Centre: the Spitzer median image and the bright-minus-faint difference, in which the variable is a point source. Right: how much the fit improves against trial period. This is the hunt's working diagnostic plot, shown as produced."

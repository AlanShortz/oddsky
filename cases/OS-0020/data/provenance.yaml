    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 248.915374 -35.86921
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-31T02:53:50+00:00'
  rows_raw: 280
  rows_kept: 41
  cuts:
  - 'W1: qual_frame > 0 removed 1'
  - 'W1: saa_sep > 0 removed 63'
  - 'W1: moon_masked == ''00'' removed 18'
  - 'W2: qual_frame > 0 removed 1'
  - 'W2: saa_sep > 0 removed 63'
  - 'W2: moon_masked == ''00'' removed 18'
  - 'W2: ph_qual[1] in (A,B) removed 97'
  - 'W2: w2snr >= 4 removed 51'

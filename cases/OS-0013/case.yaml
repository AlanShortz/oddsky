id: OS-0013
title: A red giant eclipsed for two weeks every 386 days by something 80 suns wide
hook: 'Found in Oddsky hunt H-0004 while looking for R CrB declines. Tisserand+2020 WISE candidate 2682
  (2MASS J18205507-1340452): flat for years, then three sharp 1.7-2.2 mag eclipses in ZTF, deeper in blue,
  on a 386-day period that ZTF, Gaia and VSX had all missed because each eclipse lasts only 4% of the
  orbit.'
status: anomaly
target:
  name: Gaia DR3 4152421080966024704
  ra: 275.2294829
  dec: -13.6792014
  aliases: []
  gaia_source_id: 4152421080966024704
summary: 'Three complete eclipses (2019, 2021, 2022) and a fourth caught in ingress (2023) give P = 385.7
  +/- 1 d. Depth 1.66 mag in r, 2.19 in g, reddening the star; no secondary eclipse; even and odd cycles
  identical. The star is a 2.4 kpc giant in the Galactic plane with a large mid-infrared excess and RUWE
  1.8. Leading explanation: a companion wrapped in an opaque dusty disk roughly 80 Rsun across, the epsilon
  Aurigae / EE Cep configuration at a one-year period. Not previously catalogued as variable. Predictions
  sealed for 2027-2028; the ATLAS record (2017-2026) is the pending independent check.'
claims:
- id: C1
  text: ZTF r is flat at 14.77 mag (robust scatter ~0.02 mag) for 7.5 years apart from brief deep fades.
  tag: computed
  calls:
  - K17
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C2
  text: 'Three complete eclipses were observed: MJD 58692-58715 (r minimum 16.41 on 58701.2, depth 1.65
    mag, 9-day ingress, egress complete within 14 days), MJD 59466-59488 (g minimum 18.07 on 59470.2,
    depth 2.1 mag in g, 1.5 in r), MJD 59853-59866 (r 16.2-16.27 on 59856-59860, g 17.83 on 59858). In-eclipse
    nights carry 5-7 exposures agreeing to 0.01-0.02 mag.'
  tag: observed
  calls:
  - K4
  - K5
  - K6
  - K7
  - K8
  - K9
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C3
  text: 'A fourth event is caught in ingress: r fades from 14.79 (MJD 60231) to 14.99-15.07 on MJD 60251-60254,
    then the observing season ends.'
  tag: observed
  calls:
  - K10
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C4
  text: Phase-clustering of all points fainter than 0.5 mag below median gives P = 386.96 d, T0 = MJD
    58700.1, with 100% of deep points within 0.04 in phase and 0.3% of quiet points in the eclipse core;
    the missing-cycle test finds no evidence for a multiple of this period. Timing of the three minima
    (58701, 59471, 59858) refines this to P = 385.7 +/- 1 d.
  tag: computed
  calls:
  - K12
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C5
  text: 'The eclipse is deeper in g than in r: folded depths None (g) and None (r) mag; the g-r colour
    slope against r brightness is 1.3047697789596673 (ISM-dust expectation None). The occulter reddens
    the star: dust, with grains that are not much greyer than interstellar ones.'
  tag: computed
  calls:
  - K13
  - K14
  - K15
  retracted: the first draft quoted empty fields from the fold tool; replaced by C10
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C6
  text: No secondary eclipse deeper than the folded noise is seen at phase 0.5 in r or g.
  tag: computed
  calls:
  - K13
  - K14
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C7
  text: 'Gaia DR3: G = 14.76, BP-RP = 2.01, parallax 0.417 +/- 0.045 mas (2.4 kpc), RUWE = 1.81, at l
    = 17.3, b = +0.4. Nearest Gaia neighbours: G 18.5 at 3.0 arcsec (3% of the flux) and G 16.1 at 8.2
    arcsec (29%, outside the ZTF aperture). WISE W1-W4 = 7.95, 7.17, 4.21, 2.90: a large mid-infrared
    excess. 2MASS J-K = 2.1.'
  tag: observed
  calls:
  - K16
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C8
  text: Lomb-Scargle on the r series finds no significant periodicity apart from aliases; the eclipses
    are too brief (about 4% of the period) for a sinusoid search, which is why Gaia DR3 and ZTF classifiers
    did not flag it. VSX has no entry at this position. SIMBAD lists it as an intrinsically red Spitzer
    source (Robitaille+2008), a SPICY candidate young star (Kuhn+2021), a Gaia DR2 long-period-variable
    candidate and a WISE-colour R CrB candidate (Tisserand+2012, 2020; Karambelkar+2024 priorities).
  tag: computed
  calls:
  - K18
  - K1
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C9
  text: 'With P = 386 d and a total mass of 1-3 Msun the orbit is 1.1-1.6 AU. An eclipse lasting 15-20
    days covers 4-5% of the orbit, so the occulter is roughly 60-100 Rsun across: far larger than any
    star, the size of a dusty disk around a companion.'
  tag: inferred
  calls:
  - K13
  - K12
  author: claude-fable-5.1
  at: '2026-10-27T19:33:00+00:00'
- id: C10
  text: 'Folded at P = 385.7 d, T0 = MJD 58701.0: the deepest in-eclipse point is 1.66 mag below the 14.76
    baseline in r (K28) and 2.19 mag below the 15.99 baseline in g (K29); at phase 0.5 the deepest point
    is 0.09 (r) and 0.14 (g) mag, i.e. no secondary eclipse above the 0.03-0.04 mag out-of-eclipse scatter.
    Even and odd cycles both reach full depth (r: 1.66 and 1.58 mag), so the period is not 2 x 385.7 d.
    Simultaneous g and r (253 pairs within a day) give d(g)/d(r) = 1.30 with r = 0.99 (K15): the occulter
    reddens the star like dust with grains somewhat larger than interstellar ones (ISM ratio ~1.4, grey
    = 1.0).'
  tag: computed
  calls:
  - K28
  - K29
  - K15
  author: claude-fable-5.1

id: OS-0037
title: 'BD+28 4177: the B giant whose infrared excess vanished across the WISE gap'
hook: In 2010-11 WISE saw this B0.5 giant 2.3x brighter at 3.4 microns and 14x at 22; since 2014 it is
  a bare photosphere. Found by hunt H-0016.

hypotheses:
- id: H1
  klass: eruptive
  statement: 'A Be-star decretion disk: free-free and bound-free emission from a dense gaseous disk (spectral
    index ~0.6-1 fits F_nu ~ nu^1.0 across W1-W4) that was present through 2010-11 and dissipated before
    2014. Supported by the Hipparcos variability flag, the drifting ~1.1 c/d TESS signal, and five other
    Be stars found with the same signature in H-0016. Not supported by any emission-line observation:
    Gaia 2014-17 sees weak H-alpha absorption after the event.'
  supports:
  - C1
  - C2
  - C4
  conflicts: []
  would_falsify: An H-alpha spectrum now showing no emission would not falsify (the disk is gone); a 2010-11
    spectrum without emission would. A 2010 optical light curve showing no brightening of 0.1-0.5 mag
    would weaken it.
  status: live
  confidence: 0.5
  author: unknown-agent
  at: '2026-11-03T23:30:11+00:00'
- id: H2
  klass: dust_formation
  statement: 'A transient dust episode: a ~1,300-1,500 K blackbody also reproduces the W1-W4 excess ratios
    (predicted F_nu(22)/F_nu(3.4) = 0.11 versus 0.14 observed), as in B[e] stars or dust condensing in
    ejecta from a companion. Would have to form and clear within about four years.'
  supports:
  - C1
  - C2
  conflicts: []
  would_falsify: A 2010-11 spectrum with strong Balmer emission and no dust features; or a near-infrared
    colour (J-K) unchanged in 2010-11 while W1-W4 rose.
  status: live
  confidence: 0.3
  author: unknown-agent
  at: '2026-11-03T23:30:12+00:00'
- id: H3

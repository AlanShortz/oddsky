claims:
- id: C1
  text: 'AllWISE 2010-11 (catalogue row in the case context; profile fit and aperture agree to 0.02 mag,
    SNR 47, detected in all 29 frames, position 0.02 arcsec from Gaia): W1 8.91, W2 8.68, W3 8.05, W4
    7.40. The two 2010 epochs (Jun and Dec) give W1 8.90 and 8.91 (hunt H-0016, work/steps_mep_epochs.csv).
    NEOWISE 2014-2024: W1 10.23 and W2 10.28, flat to 0.009 and 0.014 mag robust scatter over 21 visits,
    no step larger than 0.03 mag; 2MASS K = 10.25. The star was 3.4x brighter at 3.4 microns and 4.4x
    at 4.6 microns throughout 2010-11 than at any time since 2014.'
  tag: computed
  calls:
  - K3
  - K4
  - K5
  - K7
  author: unknown-agent
  at: '2026-11-03T23:30:06+00:00'
- id: C2
  text: 'The 2010-11 excess is real in the images: unWISE coadds of the 2010-11 frames alone give 2.68x
    (W1) and 2.78x (W2) the flux of the 2010-2020 coadd, against 2.48x predicted from the catalogue step
    and 1.00x for a catalogue error; the referee of H-0016 reproduced 2.68-2.69 and 2.78 with independent
    aperture code (hunts/H-0016/work/steps_unwise_verdict.csv, reviews/claude-referee-2026-11-03.md).
    Relative to the Rayleigh-Jeans photosphere set by K = 10.25 the excess was 2.3x, 3.1x, 6.9x and 14x
    at 3.4, 4.6, 12 and 22 microns (F_nu rising as nu^+1.0).'

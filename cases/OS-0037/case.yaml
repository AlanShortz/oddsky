  author: unknown-agent
  at: '2026-11-03T23:30:07+00:00'
- id: C3
  text: 'Gaia DR3 1801411783339764608: G 9.85, BP-RP -0.16, Teff 22,400 K (GSP-Phot), parallax 0.19 +-
    0.05 mas (4-7 kpc, 1.3-2.1 kpc below the plane at b = -17.9 deg), RUWE 1.09, no neighbour within 6
    arcsec. SIMBAD: B0.5IIIk (Morgan 1951, a peculiar O star at high galactic latitude); Hipparcos HIP

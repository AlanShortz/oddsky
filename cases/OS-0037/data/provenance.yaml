gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(326.25563338677,29.56164291393), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source
      WHERE 1=CONTAINS(POINT(ra,dec), CIRCLE(326.25563338677,29.56164291393,0.008333333333333333)) ORDER
      BY sep_arcsec
  retrieved_at: '2026-11-03T22:49:10+00:00'
  rows_raw: 4
  rows_kept: 4
  cuts: []
  notes: []
  status: ok

id: OS-0026
title: 'A star in Scorpius brightened sixfold in 2015, seen by NEOWISE and Gaia: an apparently unreported
  microlensing candidate'
hook: Found blind in Oddsky hunts H-0008/H-0009 (NEOWISE x4.5 on 2015 Sep 7). Gaia DR3 epoch photometry
  shows the same event, x5.9 seven days earlier and fading over six weeks, equal in BP and RP. Gaia's
  own classifier labels the star MICROLENSING.

gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(325.67834770733,43.58607440069), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source
      WHERE 1=CONTAINS(POINT(ra,dec), CIRCLE(325.67834770733,43.58607440069,0.008333333333333333)) ORDER
      BY sep_arcsec
  retrieved_at: '2026-10-27T06:04:25+00:00'
  rows_raw: 19
  rows_kept: 19
  cuts: []
  notes: []
  status: ok
neowise:
  archive: IRSA Gator neowiser_p1bs_psd
  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 325.67834770733 43.58607440069
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-27T06:05:05+00:00'
  rows_raw: 396
  rows_kept: 42
  cuts:
  - 'W1: qual_frame > 0 removed 75'
  - 'W1: w1rchi2 < 5x source median removed 10'
  - 'W2: qual_frame > 0 removed 75'
  - 'W2: cc_flags[1] == ''0'' removed 1'
  - 'W2: w2rchi2 < 5x source median removed 6'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

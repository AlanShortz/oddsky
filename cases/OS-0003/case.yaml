- id: C17
  text: 'Referee check: a separate photometric V record supports a deep 1997 eclipse. Observer CK (13
    V points) reached V = 12.54, a median of 1.61 mag (faintest 1.73) below the 2008 V level near minimum.
    Out-of-eclipse V levels in 2008, 2014 and 2025 agree within 0.01 mag.'
  tag: computed
  calls:
  - K109
  - K110
  - K111
  author: claude-referee
  at: '2026-10-27T08:58:54+00:00'
- id: C18
  text: 'Referee check: mid-eclipse depends on the depth level used, because the eclipses are asymmetric.
    Bisectors at 0.1/0.2/0.3 mag (nightly profiles, pandas) are 2014: MJD 56889.9/56892.0/56893.8 and
    2025: 60993.2/60992.5/60991.7, so the two-cycle mean period is 2049-2052 d. The 2020 eclipse (bisectors
    58928.9-58933.6; tool minimum 58929.4) came about 10 d earlier than a linear ephemeris through 2014
    and 2025 (~58942). This matches AAVSO reports that the 2020 eclipse began earlier than predicted.'
  tag: computed
  calls:
  - K108
  - K102
  - K103
  - K104
  author: claude-referee
  at: '2026-10-27T08:58:54+00:00'
- id: C19
  text: 'Referee check: duration is not constant across eclipses. Widths at 0.1 mag are about 33 d (2014),
    46 d (2020) and 36 d (2025); at 0.3 mag about 17, 24 and 26 d. 2014 was flat-bottomed (within 0.05
    mag of minimum for about 6 nights). 2025 was V-shaped (about 2 nights). 2020 was flat at 0.45-0.5
    mag for about 13 nights (+0..+12 d), so its true depth is probably close to 0.5 despite the -6..-2
    d gap.'
  tag: computed
  calls:
  - K105
  - K106
  - K108
  - K55
  - K65
  author: claude-referee
  at: '2026-10-27T08:58:54+00:00'
- id: C20
  text: 'Referee check: TESS has no sector within about 380 d of any eclipse (sectors 16-17, 56-57, 76-77,
    83-84; last point MJD 60609.8). It cannot test the depth claims.'
  tag: observed
  calls:
  - K107
  author: claude-referee
  at: '2026-10-27T08:58:54+00:00'
- id: C21
  text: 'Referee check: an instrumental or comparison-star origin for the 2025 depth is implausible. The
    two observers with both eclipses (ATE, DUBF) measured about 0.71 in 2014 and at least 1.35 / 1.44
    in 2025. Observers'' 2025 baselines agree within 0.03 mag. The dip returns to baseline afterwards
    (post minus pre = 0.01), is nearly grey across B, V and I, and is matched by visual estimates. A shared
    comparison-star fault would have to mimic a symmetric 30-day dip at the predicted time. Not checked:
    comparison-star IDs and transformed/untransformed flags, which the case data do not keep.'
  tag: inferred
  calls:
  - K10
  - K78
  - K83
  - K101
  - K91
  - K92
  author: claude-referee
  at: '2026-10-27T08:58:54+00:00'
- id: C22
  text: 'Referee check on novelty: the SIMBAD check returns only the titles of the 25 most recent references,
    so it cannot show that no paper discusses the 2020 or 2025 eclipses. A web search on 2026-10-27, outside
    the tools, found AAVSO Alert Notice 700 (2020 campaign, D. Kubicki, NCU Torun, publication planned)
    and AAVSO Campaign #894 (2025-26). Pienkowski et al. (2020) report the 2014 depth of 0.71 mag and
    that the published disk-precession model had predicted about 2.0 mag. Varying depths of 0.5-2 mag
    and the precession interpretation are already in the literature.'
  tag: observed
  calls:
  - K82
  author: claude-referee
  at: '2026-10-27T08:58:54+00:00'
- id: C23
  text: 'The 2025 eclipse reached 1.44 +/- 0.03 mag in V at minimum (MJD 60991-60993): eight observers,
    each measured against their own baseline, span 1.35-1.47. ATE, the most prolific observer, has no
    data on those nights. That is twice 2014''s 0.70 mag in magnitudes; in light blocked, 73% against
    48%.'
  tag: computed
  calls:
  - K11
  author: claude-opus-5.5
  at: '2026-10-27T09:00:56+00:00'
- id: C24
  text: 'No refereed paper on the 2020 or 2025 depths turned up in a SIMBAD title check or a short web
    search. Both eclipses were professional-led AAVSO campaigns (2020: Alert Notice 700, Torun; 2025-26:
    Campaign #894), so this case is an early independent measurement from public data, not a discovery.'
  tag: observed
  calls:
  - K21
  author: claude-opus-5.5
  at: '2026-10-27T09:00:56+00:00'
- id: C25
  text: Disk precession, an existing published interpretation, would naturally produce depths that change
    from eclipse to eclipse, but its model predicted about 2.0 mag for 2014 and 0.71 was observed. The
    different 2014 (flat-bottomed) and 2025 (V-shaped) profiles and the early 2020 eclipse mean tilt alone
    may not explain the record.
  tag: speculated
  calls:
  - K8
  - K9
  author: claude-opus-5.5
  at: '2026-10-27T09:00:56+00:00'
hypotheses:
- id: H1
  klass: eclipse_companion
  statement: A dark, opaque disk around an unseen companion crosses the B star every ~2050 days. The depth
    changes from eclipse to eclipse; disk precession (an existing interpretation) is one candidate cause,
    not yet a demonstrated one.
  supports:
  - C2
  - C4
  - C7
  - C10
  - C23
  conflicts: []
  would_falsify: A 2031 eclipse at the predicted time that is much longer, or not grey, or the eclipse
    failing to recur on the 2050-day clock.
  status: favored
  confidence: 0.8
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: H2
  klass: dust_occultation
  statement: Same companion and disk, but the depth changes come from clumpy or evolving dust in the disk
    rather than from geometry (precession).
  supports:
  - C1
  - C2
  - C6
  conflicts:
  - C7
  - C8
  would_falsify: Depths that return smoothly and predictably (quasi-periodic) favour geometry; random
    depth jumps from one eclipse to the next favour clumps.
  status: live
  confidence: 0.12
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: H3
  klass: artifact_instrumental
  statement: The 2025 depth is an artifact of one dominant observer's calibration.
  supports: []
  conflicts:
  - C13
  - C21
  would_falsify: Nine observers agree to 0.03 mag against their own baselines. Dead unless those observers
    turn out to share a comparison-star error.
  status: rejected
  confidence: 0.03
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'

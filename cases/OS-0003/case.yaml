summary: 'EE Cep''s November 2025 eclipse reached 1.44 +/- 0.03 mag in V at minimum, twice 2014''s 0.70
  mag (73% vs 48% of the light blocked). Eight independent AAVSO observers measured it, and it does not
  depend on any single one. Its profile differs from 2014''s: V-shaped rather than flat-bottomed. This
  is an early independent measurement from public data of an eclipse that professional-led AAVSO campaigns
  observed and plan to publish, not a discovery. An Oddsky referee agent checked it and corrected five
  overstatements; see reviews/. Forecasts for June 2031 are sealed.'
claims:
- id: C1
  text: 'The November 2025 eclipse reached a depth of 1.42 mag in V: nine independent AAVSO observers,
    each measured against their own out-of-eclipse baseline, agree to within 0.03 mag (ATE alone contributed
    838 points across the minimum).'
  tag: computed
  calls:
  - K11
  retracted: 'Reworded per referee: the 838-point attribution was wrong (ATE did not observe the two deepest
    nights). Restated in a new claim.'
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C2
  text: The 2014 eclipse, measured the same way, was 0.69 mag deep (seven observers, spread 0.03 mag).
    The 2025 eclipse was twice as deep.
  tag: computed
  calls:
  - K10
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C3
  text: The 2020 eclipse was about 0.5-0.6 mag deep, but only 32 V points cover its core (the spring-2020
    pandemic season); the depth is a lower bound.
  tag: computed
  calls:
  - K4
  - K19
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C4
  text: The 2025 eclipse lasted about as long as 2014's (34 vs 30 days above 0.1 mag, from a 400-day running
    baseline) and was roughly symmetric (ingress 16 d, egress 18 d).
  tag: computed
  calls:
  - K8
  - K9
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C5
  text: 'The dimming is nearly grey but slightly deeper in blue: in 2025 dB:dV:dI = 1.42:1.19:1.07 over
    the core window, the same ordering as 2014 (0.72:0.68:0.56).'
  tag: computed
  calls:
  - K1
  - K2
  - K3
  - K5
  - K6
  - K7
  retracted: 'Referee: compared different nights (ATE''s off-minimum nights pulled V shallow). Same-night
    depths are B 1.49, V 1.44, I 1.23 and the colour slopes match 2014 (see referee claim C15).'
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C6
  text: AAVSO visual and CCD records give eclipse depths (lower bounds where sparse) of about 0.6 (1980),
    1.3 (1986), 1.3 (1992), 2.0 (1997), 0.8 (2003), 0.46 (2009), 0.77 (2014), 0.6 (2020) and 1.52 (2025)
    mag, using the faintest point against the pre-eclipse median.
  tag: computed
  calls:
  - K12
  - K13
  - K14
  - K15
  - K16
  - K17
  - K18
  - K19
  - K20
  retracted: 'Referee: single faintest points inflate depths (2014 visual faintest gives 1.0 vs 0.70 from
    medians). Superseded by the referee''s median-based history (C16, C17).'
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C7
  text: Eclipses were deep for about a decade (1986-1997), shallow for about 22 years (2003-2020), and
    deep again in 2025.
  tag: inferred
  calls:
  - K12
  - K13
  - K14
  - K15
  - K16
  - K17
  - K18
  - K19
  - K20
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C8
  text: Twice the depth at about the same duration means the occulter covered a larger fraction of the
    star's disk, not that it became longer along its orbit. That is what a change in the tilt of a thin,
    opaque disk would do; a change in its size would also lengthen the eclipse.
  tag: inferred
  calls:
  - K8
  - K9
  - K10
  - K11
  retracted: 'Overstated as an inference: precession is an existing published interpretation whose model
    predicted ~2.0 mag for 2014 (observed 0.71), and the 2014/2025 shapes differ. Restated as speculation
    in a new claim.'
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C9
  text: SIMBAD indexes no refereed paper on the 2020 or 2025 eclipses; the most recent is the 2014 campaign
    (Pienkowski et al. 2020).
  tag: observed
  calls:
  - K21
  retracted: 'Referee: a SIMBAD title check of the 25 most recent references is not a novelty check. Both
    eclipses were professional-led AAVSO campaigns (Alert Notice 700, Campaign #894) with publication
    planned.'
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C10
  text: Mid-eclipse fell on about MJD 60992.6 (2025-11-13). Two cycles after 2014's mid-eclipse (MJD 56893.6),
    that is a mean period of 2049.5 days, consistent with the published ~2050-day period.
  tag: computed
  calls:
  - K8
  - K9
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C11
  text: A blind Oddsky trial agent (Trial 001, packet H01), given data cut in October 2024, forecast mid-eclipse
    13 days earlier than it happened and rated a 0.25+ mag-deeper-than-2014 core as a coin flip. The eclipse
    was much deeper than any of its forecasts implied.
  tag: observed
  calls: []
  author: claude-opus-5.5
  at: '2026-10-27T08:49:51+00:00'
- id: C12
  text: 'Relative to 2014, the 2025 eclipse is deeper by a similar factor across the whole profile: 1.8x
    in the early wing (-16..-10 d: 0.44 vs 0.25 mag), 1.9x at the core (+/-2 d: 1.34 vs 0.70), 1.7x in
    the late wing (+10..+16 d: 0.29 vs 0.17). The eclipse got deeper everywhere, not just in a new central
    core (an over-reading of the overlay plot that these numbers rule out).'
  tag: computed
  calls:
  - K41
  - K42
  - K43
  - K47
  - K48
  - K49
  author: claude-opus-5.5
  at: '2026-10-27T08:50:48+00:00'
- id: C13
  text: 'Referee check: the 2025 V depth does not depend on ATE. ATE has no points on the two deepest
    nights (MJD 60991-60993); on those nights eight other observers, each against their own baseline,
    give a median depth of 1.44 mag (range 1.35-1.47, robust spread 0.02). Where ATE and others share
    a night, their nightly depths agree to about 0.05 mag (per-night table from aavso.parquet, pandas).
    ATE''s own faintest point (1.36) comes from after minimum. C1''s 1.42 is a median of each observer''s
    single faintest point; the observers span 1.35-1.46.'
  tag: computed
  calls:
  - K78
  - K83
  - K53
  author: claude-referee
  at: '2026-10-27T08:58:54+00:00'
- id: C14
  text: 'Referee check: at the same eclipse phase (nights -1..0), 2014 was 0.70 mag deep in V (ATE, SBL),
    with B 0.73 and I 0.64 (SBL only). The 2014 minimum is flat-bottomed and densely sampled, so it was
    not missed; Pienkowski et al. (2020) independently report 0.71 mag in V. 2025/2014 = 2.06 in magnitudes,
    but in flux 2025 blocked about 73% of the light versus 48% in 2014 (1.5x).'
  tag: computed
  calls:
  - K84
  - K87
  - K88
  - K55
  - K10
  author: claude-referee
  at: '2026-10-27T08:58:54+00:00'
- id: C15
  text: 'Referee check: C5''s band ratios (dB:dV:dI = 1.42:1.19:1.07 in 2025) are a sampling artefact.
    The V median in that window is pulled down by ATE''s off-minimum nights. On the same nights (-1..0)
    the depths are B 1.49, V 1.44, I 1.23. Same-time colour slopes are dB/dV = 1.06 (2014) and 1.02 (2025),
    and dI/dV = 0.84 and 0.91 (interstellar dust: 1.32 and 0.59). Both eclipses are nearly grey with the
    same colour behaviour.'
  tag: computed
  calls:
  - K83
  - K85
  - K86
  - K89
  - K90
  - K91
  - K92
  author: claude-referee

- id: C16
  text: 'Referee check: the faintest-point statistic in C6 inflates visual depths. In 2014 the median
    of visual estimates within -7..+3 d of mid-eclipse is 0.70 mag (matching CCD), but the faintest single
    visual estimate is 1.0 mag. Median visual depths over -7..+3 d: 1980 ~0.6 (3 estimates), 1986 ~1.1
    (3 estimates, all from one observer, HEF), 1992 ~1.15 (8), 1997 ~1.6 (22 estimates, 6 observers),
    2003 ~0.55, 2009 ~0.45, with roughly 0.15-0.3 mag uncertainty.'
  tag: computed
  calls:
  - K93

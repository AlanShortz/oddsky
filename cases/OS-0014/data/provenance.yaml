neowise:
  archive: IRSA Gator neowiser_p1bs_psd
  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 278.27585 -36.12034
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-27T17:44:31+00:00'
  rows_raw: 298
  rows_kept: 42
  cuts:
  - 'W1: qual_frame > 0 removed 3'
  - 'W1: saa_sep > 0 removed 68'
  - 'W1: moon_masked == ''00'' removed 28'
  - 'W1: nb == 1 (no blending) removed 1'
  - 'W1: w1rchi2 < 5x source median removed 5'
  - 'W2: qual_frame > 0 removed 3'
  - 'W2: saa_sep > 0 removed 68'
  - 'W2: moon_masked == ''00'' removed 28'
  - 'W2: nb == 1 (no blending) removed 1'
  - 'W2: w2rchi2 < 5x source median removed 2'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(56.92895976487,35.01226990153), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source
      WHERE 1=CONTAINS(POINT(ra,dec), CIRCLE(56.92895976487,35.01226990153,0.008333333333333333)) ORDER
      BY sep_arcsec
  retrieved_at: '2026-10-27T08:37:29+00:00'
  rows_raw: 7
  rows_kept: 7
  cuts: []
  notes: []
  status: ok
gaia_epoch:
  archive: ESA Gaia DR3 epoch photometry (datalink)
  query:
    source_id: 219832339066395776
  retrieved_at: '2026-10-27T08:37:32+00:00'
  rows_raw: 139
  rows_kept: 137
  cuts: []
  notes:

id: OS-0030
title: 'An infrared flare in the galaxy NGC 3239 in 2020 that no optical survey saw: an obscured transient'
hook: 'Found blind by Oddsky''s mid-infrared difference imaging of 318 nearby galaxies (hunt H-0012):
  a flare peaking in 2020 November at about 5e5 L_sun, with no optical alert. Hubble caught a faint point
  source 85 days after the peak that has since vanished, and JWST found cooling dust at the same spot
  in 2024.'
status: reproduced
target:
  name: NGC 3239 IR transient 2020
  ra: 156.291224
  dec: 17.163778
  aliases: []
summary: A mid-infrared flare in the irregular galaxy NGC 3239 (about 8-12 Mpc), peaking in 2020 November
  at roughly 5e5 L_sun from ~960 K dust, that no optical survey reported. Hubble caught a faint, fading
  point source 85 days after the peak, and JWST found cooling dust at the same spot in 2024. Probably
  a dust-obscured stellar merger or eruption; a buried low-energy supernova is possible. Found blind by
  Oddsky hunt H-0012.
claims:
- id: C1
  text: 'WISE (unWISE neo11 epochal coadds, difference imaging): flat from 2010 to 2020 May 2; on 2020
    Nov 23 W1 +232 +- 8 and W2 +308 +- 20 uJy above the 2010-11 level; 91/119 uJy in 2021 Apr, 38/42 in
    2021 Nov, ~27 in 2022 Apr. Position 156.29118 +17.16387 (Gaia-tied, ~0.25"). Positive in both visit
    seasons, so not an asteroid (hunts/H-0012/reviews/ngc3239-check-2026-11-01.md).'
  tag: observed
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T01:26:37+00:00'
- id: C2
  text: The transient's W1-W2 is 0.95 +- 0.08 (~960 K dust); a blackbody gives ~5.6e5 L_sun at 7.9 Mpc
    (1.6-2.4x more at the 10-12 Mpc of SN 2012A's host distance and CosmicFlows-4). The rise is unresolved
    (< 205 d), so the true peak may be higher.
  tag: computed
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T01:26:37+00:00'
- id: C3
  text: 'HST (2021 Feb 16): a point source at 156.291224 +17.163778, 0.37" from the WISE centroid, F606W
    25.93 +- 0.06 and F814W 24.95 +- 0.06 AB, present in all four 2021 exposures; absent in 2022 (F606W
    > 27.1) and in every 2025 filter, with no residual cluster (M_V > -2.9). The chance of an unrelated
    vanishing source within 0.37" is ~0.2%.'
  tag: observed
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T01:26:37+00:00'
- id: C4
  text: 'JWST (programme 3707, 2024 Apr-May): a new unresolved source 0.01" from the HST position, F335M
    5.9 uJy and F300M 3.2-3.6 uJy, nothing in F150W (> 26.5 AB): ~580 K dust at ~3.6e4 L_sun. Spitzer
    2008 shows nothing there (> 8 sigma below the 2024 source).'
  tag: observed
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T01:26:37+00:00'
- id: C5
  text: 'No optical detection: no TNS object or ZTF alert; ATLAS limits o ~20.4-21.7 around the event;
    the galaxy was in solar conjunction in 2020 August. VLASS < 0.36 mJy (2021 Nov); Chandra 2025 < 2.6e37
    erg/s.'
  tag: observed
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T01:26:37+00:00'
- id: C6
  text: 'Not a buried normal supernova as it stands: the HST colour allows A_V <~ 2, while the faintness
    relative to WISE needs A_V 9-20, and an enshrouded Type II SN should be 30-100x brighter in the infrared
    at this phase. An obscured luminous red nova (stellar merger), an ILRT-like eruption (no progenitor
    seen), or a low-energy SN behind clumpy dust fit better. Not an AGN: 2.7 kpc from the centre of a
    galaxy with no nucleus.'
  tag: inferred
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T01:26:37+00:00'
- id: C7
  text: 'Not reported (2026-11-01): TNS, Gaia alerts, CBAT, ATel (web search), SPIRITS, MIRONG, the literature;
    no publication on the JWST 3707 data at this position. ADS full-text check of the De et al. WISE transient
    papers still owed.'
  tag: observed
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T01:26:37+00:00'
- id: C8
  text: 'ADS full text (2026-11-01, hunts/H-0012/work/ads_novelty.json): none of the 67 WISE/NEOWISE transient
    papers by De et al. and the SPIRITS papers mentions NGC 3239; the 59 papers mentioning NGC 3239 (or
    Arp 263, UGC 5637) with transient/infrared terms since 2020 are galaxy, ISM and morphology studies
    and the SN 2012A progenitor-disappearance study, none reporting a 2020 transient; coordinate searches
    find only unrelated papers. Apparently unreported.'
  tag: observed
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T03:55:18+00:00'
- id: C9
  text: 'Timing correction to C1/C2 from the TNS pre-filing check (hunts/H-0012/drafts/tns_OS-0030_validation.md,
    recompute_numbers.py): epoch times are now the mean of the NEOWISE exposures covering the source,
    not the tile-wide unWISE header midpoint. Last quiet epoch 2020-04-28 18:15 UT (MJD 58967.760; C1
    said 2020 May 2); first detection 2020-11-23 16:30 UT (MJD 59176.688; earlier notes used 59176.37);
    later epochs 2021-04-30 and 2021-11-22. The rise is therefore unresolved within < 209 d (C2 said <
    205 d). Forced photometry at the HST position gives W1 +231.8 +- 8.3 and W2 +310.0 +- 20.0 uJy at
    discovery (28 and 15.5 sigma) and 94/129 uJy on 2021-04-30, consistent with C1 within the errors.
    Published distances to NGC 3239 span 6.95-12.4 Mpc (NED, 12 values), so C2''s luminosity scales accordingly.'
  tag: computed
  calls: []
  author: claude-opus-5.5
  at: '2026-11-02T04:31:42+00:00'

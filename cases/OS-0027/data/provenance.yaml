gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(271.00958351919,-18.31329775461), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source
      WHERE 1=CONTAINS(POINT(ra,dec), CIRCLE(271.00958351919,-18.31329775461,0.008333333333333333)) ORDER
      BY sep_arcsec
  retrieved_at: '2026-10-31T19:28:48+00:00'
  rows_raw: 43
  rows_kept: 43
  cuts: []
  notes: []
  status: ok

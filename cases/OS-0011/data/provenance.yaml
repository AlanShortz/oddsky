neowise:
  archive: IRSA Gator neowiser_p1bs_psd
  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 287.10668 27.83755
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-27T09:23:11+00:00'
  rows_raw: 413
  rows_kept: 40
  cuts:
  - 'W1: qual_frame > 0 removed 16'
  - 'W1: cc_flags[0] == ''0'' removed 8'
  - 'W1: nb == 1 (no blending) removed 13'
  - 'W2: qual_frame > 0 removed 16'
  - 'W2: nb == 1 (no blending) removed 13'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

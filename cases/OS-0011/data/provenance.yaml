gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(287.10668,27.83755), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source WHERE
      1=CONTAINS(POINT(ra,dec), CIRCLE(287.10668,27.83755,0.008333333333333333)) ORDER BY sep_arcsec
  retrieved_at: '2026-10-27T09:22:58+00:00'
  rows_raw: 25
  rows_kept: 25
  cuts: []
  notes: []
  status: ok
gaia_epoch:
  archive: ESA Gaia DR3 epoch photometry (datalink)
  query:
    source_id: 2037357495383317504
  retrieved_at: '2026-10-27T09:23:01+00:00'
  rows_raw: 165
  rows_kept: 162
  cuts: []

neowise:
  archive: IRSA Gator neowiser_p1bs_psd
  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 277.670788 -22.163984
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-30T15:32:16+00:00'
  rows_raw: 295
  rows_kept: 39
  cuts:
  - 'W1: qual_frame > 0 removed 31'
  - 'W1: saa_sep > 0 removed 58'
  - 'W1: moon_masked == ''00'' removed 48'
  - 'W1: cc_flags[0] == ''0'' removed 78'
  - 'W2: qual_frame > 0 removed 31'
  - 'W2: saa_sep > 0 removed 58'
  - 'W2: moon_masked == ''00'' removed 48'
  - 'W2: cc_flags[1] == ''0'' removed 51'
  - 'W2: ph_qual[1] in (A,B) removed 1'
  - 'W2: w2rchi2 < 5x source median removed 1'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

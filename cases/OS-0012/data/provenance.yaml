gaia:
  archive: ESA Gaia TAP gaiadr3.gaia_source
  query:
    adql: SELECT source_id, ra, dec, parallax, parallax_over_error, pmra, pmdec, ruwe, phot_g_mean_mag,
      phot_bp_mean_mag, phot_rp_mean_mag, bp_rp, phot_variable_flag, teff_gspphot, distance_gspphot, non_single_star,
      DISTANCE(POINT(271.37757,9.46541), POINT(ra,dec))*3600 AS sep_arcsec FROM gaiadr3.gaia_source WHERE
      1=CONTAINS(POINT(ra,dec), CIRCLE(271.37757,9.46541,0.008333333333333333)) ORDER BY sep_arcsec
  retrieved_at: '2026-10-27T09:23:39+00:00'
  rows_raw: 15
  rows_kept: 15
  cuts: []
  notes: []
  status: ok
gaia_epoch:
  archive: ESA Gaia DR3 epoch photometry (datalink)
  query:
    source_id: 4482344869315388928
  retrieved_at: '2026-10-27T09:23:42+00:00'
  rows_raw: 120
  rows_kept: 116
  cuts: []

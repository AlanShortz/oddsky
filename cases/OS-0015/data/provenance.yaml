neowise:
  archive: IRSA Gator neowiser_p1bs_psd
  query:
    catalog: neowiser_p1bs_psd
    spatial: cone
    radius: 3.0
    radunits: arcsec
    objstr: 275.2294829 -13.6792014
    outfmt: 1
    selcols: mjd,w1mpro,w1sigmpro,w2mpro,w2sigmpro,qual_frame,qi_fact,saa_sep,moon_masked,cc_flags,ph_qual,w1sat,w2sat,nb,na,w1snr,w2snr,w1rchi2,w2rchi2
  retrieved_at: '2026-10-27T19:28:31+00:00'
  rows_raw: 289
  rows_kept: 21
  cuts:
  - 'W1: qual_frame > 0 removed 6'
  - 'W1: saa_sep > 0 removed 47'
  - 'W1: moon_masked == ''00'' removed 25'
  - 'W1: cc_flags[0] == ''0'' removed 194'
  - 'W2: qual_frame > 0 removed 6'
  - 'W2: saa_sep > 0 removed 47'
  - 'W2: moon_masked == ''00'' removed 25'
  - 'W2: cc_flags[1] == ''0'' removed 192'
  notes:
  - rows_kept counts 6-month visits (W1 and W2), not exposures
  status: ok

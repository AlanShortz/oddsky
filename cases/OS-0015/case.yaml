- id: C4
  text: Phase-clustering of all points fainter than 0.5 mag below median gives P = 386.96 d, T0 = MJD
    58700.1, with 100% of deep points within 0.04 in phase and 0.3% of quiet points in the eclipse core;
    the missing-cycle test finds no evidence for a multiple of this period. Timing of the three minima
    (58701, 59471, 59858) refines this to P = 385.7 +/- 1 d.

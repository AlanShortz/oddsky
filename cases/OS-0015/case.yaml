- id: C11
  text: 'Period and aliases survive. eclipse_period on r+g (depth 0.5) and r alone (depth 1.0) returns
    387.0 and 387.4 d with every deep point within 0.012 in phase (K41, K42). Folds at P/2 = 192.85 d,
    365.25 d and 182.6 d leave the odd cycles flat (median delta 0.06, -0.03, 0.04 mag against 1.40, 0.43,
    1.37 for the even ones: K44, K47, K48); 2P and 3P put full-depth events at phase 0.51 and 0.67 (K45,
    K46), so the period is not a multiple. Four consecutive cycles show the full event (K43, K49). A common-template
    fit (pandas/scipy, outside the tools) to the r data of cycles 0-3 gives mid-times MJD 58701.6, 59088.6,
    59473.9, 59858.8, a linear ephemeris P = 385.69 d, T0 = 58702.2, O-C within +/-0.7 d, FWHM 7.9 d,
    width 14 d at 0.05 mag. Cycles -1 (July 2018), 5 (Nov 2024) and 6 (Dec 2025) have no ZTF data within
    8 d of the prediction (K62, K63), so they test nothing.'

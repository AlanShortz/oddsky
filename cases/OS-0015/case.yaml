- id: C2
  text: 'Three complete eclipses were observed: MJD 58692-58715 (r minimum 16.41 on 58701.2, depth 1.65
    mag, 9-day ingress, egress complete within 14 days), MJD 59466-59488 (g minimum 18.07 on 59470.2,
    depth 2.1 mag in g, 1.5 in r), MJD 59853-59866 (r 16.2-16.27 on 59856-59860, g 17.83 on 59858). In-eclipse
    nights carry 5-7 exposures agreeing to 0.01-0.02 mag.'

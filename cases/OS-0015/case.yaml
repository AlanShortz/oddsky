- id: C10
  text: 'Folded at P = 385.7 d, T0 = MJD 58701.0: the deepest in-eclipse point is 1.66 mag below the 14.76
    baseline in r (K28) and 2.19 mag below the 15.99 baseline in g (K29); at phase 0.5 the deepest point
    is 0.09 (r) and 0.14 (g) mag, i.e. no secondary eclipse above the 0.03-0.04 mag out-of-eclipse scatter.
    Even and odd cycles both reach full depth (r: 1.66 and 1.58 mag), so the period is not 2 x 385.7 d.
    Simultaneous g and r (253 pairs within a day) give d(g)/d(r) = 1.30 with r = 0.99 (K15): the occulter
    reddens the star like dust with grains somewhat larger than interstellar ones (ISM ratio ~1.4, grey
    = 1.0).'
  tag: computed

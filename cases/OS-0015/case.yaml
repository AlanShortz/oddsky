id: OS-0015
title: A dust-shrouded star in a star-forming region goes dark for a week every 385.7 days
hook: 'Found in Oddsky hunt H-0004 while looking for R CrB declines. Tisserand+2020 WISE candidate 2682
  (2MASS J18205507-1340452), 4 arcsec from IRAS 18180-1342: steady to 0.1-0.2 mag, then four sharp 1.5-2.2
  mag eclipses in four consecutive years, deeper in blue, on a strict 385.7-day period. Listed as a ''dubious''
  ATLAS variable and a Gaia DR2 long-period-variable candidate; the eclipses themselves were never reported.'
status: anomaly
target:
  name: Gaia DR3 4152421080966024704
  ra: 275.2294829
  dec: -13.6792014
  aliases: []
  gaia_source_id: 4152421080966024704
summary: 'Four full-depth eclipses (2019-2022) on P = 385.7 +/- 0.5 d, T0 = MJD 58702.2, O-C under 0.7
  d; depths 1.5-1.65 mag in r and 1.8-2.2 in g, varying by 0.2-0.4 mag between orbits; no secondary deeper
  than 0.1 mag near phase 0.5. The star is at 2.4 kpc with L ~ 20-100 Lsun (R under ~10 Rsun), a Class
  II mid-infrared SED and RUWE 1.8, in or behind an intermediate-mass star-forming region. The occulter
  is a translucent, reddening, evolving dust structure on a one-year orbit, whether around a companion
  of an evolved star or in the disk of a young binary. Referee (2026-10-27): the eclipses survive; mundane
  explanations about 5%. Predictions sealed for the 2027 quiet season and the 2028 January eclipse; the
  ATLAS record is the pending independent check.'

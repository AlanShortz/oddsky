- id: C9
  text: 'With P = 386 d and a total mass of 1-3 Msun the orbit is 1.1-1.6 AU. An eclipse lasting 15-20
    days covers 4-5% of the orbit, so the occulter is roughly 60-100 Rsun across: far larger than any
    star, the size of a dusty disk around a companion.'

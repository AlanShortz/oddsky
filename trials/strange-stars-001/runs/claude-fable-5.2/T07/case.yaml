claims:
- id: C1
  text: The star is a single-looking F-type main-sequence star (G=11.76, BP-RP=0.78, M_G=3.5 at 444 pc,
    RUWE 0.82); neighbours inside the photometric apertures contribute under 1 percent of the flux.
  tag: observed
  calls:
  - K1
  - K2
  - K14
  author: claude-fable-5.2
  at: '2026-11-11T00:05:32+00:00'
- id: C2
  text: 'TESS shows one isolated dip centred near day 1936.7: about 1.3-1.5 percent deep, about 0.6-0.7
    d long, smooth ingress and egress, not near a momentum dump or sector edge; flat to about 0.1 percent
    on either side.'
  tag: observed
  calls:
  - K23
  - K25
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:06:32+00:00'
- id: C3
  text: Ground-based V (several independent observers per night) is about 0.02-0.03 mag fainter on days
    1934-1937 than on days 1930-1933 and 1940-1941, so the TESS dip is plausibly accompanied by a broader
    shallow dimming seen independently; observer zero-point scatter of about 0.02 mag makes this suggestive
    only.
  tag: inferred
  calls:
  - K26
  - K25
  author: claude-fable-5.2
  at: '2026-11-11T00:06:34+00:00'
- id: C4
  text: The V median is 0.017-0.022 mag fainter after day 1150 than in days 500-1100 (B +0.032, I +0.032);
    formally very significant, but the observer mix changes and the level changepoints differ by band
    (V day 961, B 1390, I 3291, R 2545), so the size and colour of any secular fading are not trustworthy
    at the 0.01 mag level.
  tag: computed
  calls:
  - K18
  - K19
  - K20
  - K21
  - K3
  - K4
  - K5
  - K6
  - K17
  author: claude-fable-5.2
  at: '2026-11-11T00:06:35+00:00'
- id: C5
  text: No ground-based excursion over 0.05 mag in V in 4000 days at 4 sigma; the three roughly 0.18 mag
    B dips near days 2221-2474 rest on 1-3 observers and have no V counterpart in the 60-day bins, so
    are probably observer artifacts.
  tag: computed
  calls:
  - K9
  - K16
  - K22
  - K17
  author: claude-fable-5.2
  at: '2026-11-11T00:06:36+00:00'
- id: C6
  text: 'Mid-infrared is flat: W1 varies by 0.02 mag over 3650 days, W1-W2 is about -0.03 (photospheric)
    throughout, with no warm-dust excess and no colour-brightness correlation.'
  tag: observed
  calls:
  - K8
  - K11
  author: claude-fable-5.2
  at: '2026-11-11T00:06:37+00:00'
- id: C7
  text: TESS shows no strong periodicity (top peak 15.9 d with power 0.027, surrounded by window aliases);
    rotation or pulsation at the 0.1 percent level is not established.
  tag: computed
  calls:
  - K12
  - K7
  author: claude-fable-5.2
  at: '2026-11-11T00:06:38+00:00'
- id: C8
  text: A brief, isolated, aperiodic 1 percent dip on an otherwise quiet, IR-quiet F dwarf, with a possible
    small long-term fade, is the signature of small amounts of circumstellar material crossing the line
    of sight rather than of the star itself; a single transit by a companion cannot be excluded from one
    event.
  tag: inferred
  calls:
  - K25
  - K11
  - K19
  - K12
  author: claude-fable-5.2
  at: '2026-11-11T00:06:39+00:00'
- id: C9
  text: The combination (F dwarf, V about 11.85, about 440 pc, faint neighbour at 1.8 arcsec, huge amateur
    campaign, isolated percent-level dips) matches the well-known irregular dipper KIC 8462852; this recognition
    is not used as evidence.
  tag: speculated
  calls:
  - K1
  - K14
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:06:40+00:00'

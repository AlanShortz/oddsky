  - K6
  - K7
  - K14
  - K15
  author: claude-fable-5.2
  at: '2026-11-11T00:05:26+00:00'
- id: C2
  text: 'Each fading lasts ~25-47 d with ingress slower than egress; depth varies from event to event:
    V 0.38 (day 14039), 0.64 (16092), 0.42 (18127) mag; older visual events appear deeper (1.1-1.8 mag,
    low-precision visual estimates).'
  tag: computed
  calls:
  - K4
  - K11
  - K12
  - K13
  - K14
  author: claude-fable-5.2
  at: '2026-11-11T00:06:08+00:00'
- id: C3
  text: 'The fadings are nearly grey: dB/dV=1.04, dR/dV=0.91, dI/dV=0.84, much flatter than interstellar-type
    dust; all bands move together, confirmed by dozens of independent observers.'
  tag: computed
  calls:
  - K2
  - K6
  - K7
  author: claude-fable-5.2
  at: '2026-11-11T00:06:09+00:00'
- id: C4
  text: 'Outside the events the star is steady: V median 10.805 vs 10.804 in two consecutive ~700 d windows,
    robust scatter ~0.05 mag.'
  tag: computed
  calls:
  - K18
  - K3
  author: claude-fable-5.2
  at: '2026-11-11T00:06:11+00:00'
- id: C5
  text: The star is luminous and blue-ish (Gaia abs G about -1.2 at ~2.3 kpc, BP-RP 0.66 probably reddened),
    with single-star-like RUWE 1.28; no neighbour within the AAVSO or TESS beams is bright enough to produce
    0.4-0.7 mag fadings.
  tag: inferred
  calls:
  - K1
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:06:14+00:00'
- id: C6
  text: TESS shows a low-amplitude (~0.01 mag) ~1.98 d modulation, plausibly rotation/pulsation of a hot
    star or a contaminant (CROWDSAP 0.84); unrelated to the 2048 d events.
  tag: inferred
  calls:
  - K16
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:06:15+00:00'
- id: C7
  text: Strictly periodic, weeks-long, grey, variable-depth, asymmetric eclipses every ~5.6 yr indicate
    an extended semi-opaque body (a disk around a companion, changing projection e.g. by precession) transiting
    a hot star. This matches the known system EE Cep.
  tag: inferred
  calls:
  - K19
  - K4
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:06:16+00:00'
- id: C8
  text: The next eclipse should be centred near day 20175 (18127+2048; plausible range 20160-20185), after
    the data cutoff at 19798.
  tag: inferred
  calls:
  - K19
  - K1
  author: claude-fable-5.2
  at: '2026-11-11T00:06:17+00:00'

claims:
- id: C1
  text: Seven discrete fadings are seen, minima near days 5840, 7890, 9939 (visual), ~11992 (visual),
    14039, 16092, 18127 (CCD V/B/I); spacings 2050, 2049, 2053, 2047, 2053, 2035 d, i.e. a strict ~2048
    d period.
  tag: computed
  calls:

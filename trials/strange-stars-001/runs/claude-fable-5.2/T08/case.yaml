id: T08
title: Trial star T08
hook: ''
status: observation
summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: 'A red, low-luminosity star (G=14.4, BP-RP=2.54, M_G=8.8 at 135 pc) that is very bright in the
    mid-infrared: all 42 NEOWISE visits are saturated (W1<8), so no usable IR light curve, but the brightness
    itself implies a large infrared excess for a star this faint in the optical. No Gaia neighbour within
    24 arcsec.'
  tag: inferred
  calls:
  - K1
  - K2
  - K11
  author: claude-fable-5.2
  at: '2026-11-11T00:07:59+00:00'
- id: C2
  text: V varies irregularly between about 14.0 and 16.6 over 5100 days, with bright states (V about 14.0-14.6
    near days 780-850, 1120, 1730-1760, 3720, 4000) and faint states lasting hundreds of days (V 16.0-16.6
    near days 2080-2290, 3016, 4290-4450); seen by 11+ independent observers. Gaia itself recorded a 2.3
    mag range.
  tag: observed
  calls:
  - K3
  - K4
  - K1
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:08:00+00:00'
- id: C3
  text: 'No strict long period: the best V periods (1116 d, 778 d) have modest power on red-noise-like
    data, and the level changes are not repeatable in shape; the excursion finder returns nothing because
    the variability is the baseline.'
  tag: computed
  calls:
  - K7
  - K5
  - K4
  author: claude-fable-5.2
  at: '2026-11-11T00:08:01+00:00'
- id: C4
  text: 'The changes are nearly grey: dI/dV about 0.85-0.93, dR/dV 0.99, dB/dV 0.83-0.95, i.e. much flatter
    than interstellar reddening (I would be 0.59, B 1.32). That points to occultation by large grains
    or optically thick material with a scattered-light floor, not small-grain dust or temperature change.'
  tag: computed
  calls:
  - K2
  - K8
  - K9
  author: claude-fable-5.2
  at: '2026-11-11T00:08:02+00:00'
- id: C5
  text: 'On short timescales TESS shows continuous 0.1-0.3 mag quasi-periodic modulation with a preferred
    timescale of about 4.2 d (other peaks 3.5 and 5.7 d, so not coherent), plus discrete events: a 0.8
    mag dip lasting 1.3 d near day 5056 and 0.5 mag swings within a quarter of a day near day 5065.'
  tag: observed
  calls:
  - K6
  - K12
  - K13
  - K14
  author: claude-fable-5.2
  at: '2026-11-11T00:08:03+00:00'
- id: C6
  text: Dense ground V data (days 1340-1480) show 0.5-1 mag changes within 3-10 days on top of the slow
    state changes, confirming the TESS-type activity independently and at absolute scale.
  tag: observed
  calls:
  - K15
  author: claude-fable-5.2
  at: '2026-11-11T00:08:03+00:00'
- id: C7
  text: 'Low-mass star + strong IR excess + large, irregular, grey dimmings on day-to-year timescales
    + few-day quasi-periodic dips: a young disk-bearing star seen through its own inner disk, with long
    faint states when more disk material (a warp or raised rim) enters the line of sight.'
  tag: inferred
  calls:
  - K1
  - K4
  - K8
  - K13
  - K14
  author: claude-fable-5.2
  at: '2026-11-11T00:08:04+00:00'
- id: C8
  text: High RUWE (3.3) could be a companion or a photocentre disturbed by variability and scattered light;
    it does not identify a blend, since no neighbour lies in the aperture.
  tag: inferred
  calls:
  - K2
  - K11
  author: claude-fable-5.2
  at: '2026-11-11T00:08:05+00:00'
- id: C9
  text: Distance (about 135 pc), colour, brightness range and the pattern of extended deep faint states
    resemble the classical T Tauri star AA Tau after its 2011 fade; recognition is not used as evidence.
  tag: speculated
  calls:
  - K1
  - K4
  author: claude-fable-5.2
  at: '2026-11-11T00:08:06+00:00'

id: T06
title: Trial star T06
hook: ''
status: observation
summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: V alternates between a faint state near 11.9-12.1 and maxima near 8.5-8.7; 165 brightenings over
    60 yr of V data, typical amplitude 3.5-3.8 mag, duration 7-17 d, seen by up to 5-6 independent observers
    per day and in B, V, R, I and unfiltered CCD.
  tag: observed
  calls:
  - K1
  - K5
  - K6
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:07:03+00:00'
- id: C2
  text: 'Events are brightenings from a stable faint floor, not dips from a bright state: fast rise (2-6
    d) and slower decline (8-13 d), with long and short outbursts alternating (e.g. about 16 d wide near
    day 47025-47040 versus about 8 d near day 47078).'
  tag: observed
  calls:
  - K5
  - K6
  author: claude-fable-5.2
  at: '2026-11-11T00:07:05+00:00'
- id: C3
  text: 'Recurrence is quasi-periodic, not strict: AAVSO V gives 55.7 d with comparable peaks at 48-50
    d, TESS gives 50.4 d; power is spread over 40-70 d, as for a relaxation cycle rather than a clock.'
  tag: computed
  calls:
  - K4
  - K11
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:07:07+00:00'
- id: C4
  text: 'Around day 47100-47550 the behaviour changed: the faint-state level rose from 11.9 to about 11.0-11.2,
    outbursts became frequent and low (maxima 9.0-9.5), with a plateau near V=10.0 around day 47930-47970.
    Median V 11.91 (days 44000-47000) versus 10.73 (days 47550-48100). Normal deep quiescence (11.7-12.0)
    and 8.5-8.7 maxima returned by about day 48600.'
  tag: computed
  calls:
  - K3
  - K6
  - K7
  - K8
  author: claude-fable-5.2
  at: '2026-11-11T00:07:08+00:00'
- id: C5
  text: All optical bands move together (r=0.98); the colour slopes are close to grey-to-blue rather than
    strongly reddened in the faint state, and the star is hotter/bluer at maximum; this is a change of
    emitting source, not extinction by dust.
  tag: inferred
  calls:
  - K2
  - K10
  author: claude-fable-5.2
  at: '2026-11-11T00:07:09+00:00'
- id: C6
  text: 'NEOWISE W1/W2 vary by 0.7-1.0 mag with W1-W2 about 0.09 and no redder-when-brighter trend: the
    infrared follows the outbursts with photospheric/disk colours; no warm circumstellar dust.'
  tag: computed
  calls:
  - K1
  - K9
  author: claude-fable-5.2
  at: '2026-11-11T00:07:09+00:00'
- id: C7
  text: 'Gaia: 113 pc, M_G=6.4, BP-RP=1.18 (2014-17 mean, mostly quiescence): a K-dwarf-like faint state;
    outburst reaches M_V about +3.3. RUWE 2.33 is expected from a strongly variable source or binary.
    Only a 1% neighbour at 5.3 arcsec: the 3.5 mag outbursts cannot be a blend.'
  tag: inferred
  calls:
  - K1
  - K2
  - K12
  author: claude-fable-5.2
  at: '2026-11-11T00:07:10+00:00'
- id: C8
  text: 'The system is a dwarf nova of the U Gem (SS Cyg) subtype: a K dwarf donor feeding an accretion
    disk around a white dwarf, with thermal-instability outbursts every roughly 50 d; the day 47100-48500
    episode is an anomalous, standstill-like high-quiescence state. The data match SS Cygni itself (distance,
    magnitude range, bimodal outbursts, enormous AAVSO coverage, and its anomalous 2021 episode).'
  tag: inferred
  calls:
  - K1
  - K5
  - K6
  - K7
  author: claude-fable-5.2
  at: '2026-11-11T00:07:11+00:00'

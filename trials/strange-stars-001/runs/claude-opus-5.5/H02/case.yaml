claims:
- id: C1
  text: V spends most time near 11.2-12.0 and repeatedly brightens by 2.5-3.3 mag to V~8.4-9.1; 20 brightenings
    found in the last ~1,400 d alone, with fast rises (0.6-7 d) and somewhat slower declines (2-9 d),
    and two outburst widths (~4-6 d short, ~11-14 d long).
  tag: computed
  calls:
  - K6
  - K9
  author: claude-opus-5.5
  at: '2026-10-27T06:22:50+00:00'
- id: C2
  text: 'The brightenings recur quasi-periodically: strongest Lomb-Scargle peak 48.3 d in V (50.4 d in
    TESS), not a survey alias; recent outburst onsets near days 49456, 49498, 49539, 49582, 49605, 49639,
    49680, 49716, 49744 give intervals of 23-43 d.'
  tag: computed
  calls:
  - K4
  - K6
  - K8
  author: claude-opus-5.5
  at: '2026-10-27T06:22:52+00:00'
- id: C3
  text: 'Gaia: parallax/error 291, d=113 pc, abs G=6.4, bp_rp 1.18, Teff_gspphot 5580 K: a nearby sub-luminous
    system whose quiescent light is K-dwarf-like, ~6 mag fainter than the star in T04. Outbursts to abs
    ~3.5 are typical of a dwarf-nova accretion disk.'
  tag: inferred
  calls:
  - K1
  author: claude-opus-5.5
  at: '2026-10-27T06:22:53+00:00'
- id: C4
  text: All optical bands brighten together (r=0.98) with dB/dV=1.18, i.e. bluer when brighter as expected
    for a hot disk outburst; 208 independent observers confirm; brightest neighbour inside 5.3 arcsec
    is 5 mag fainter (1% flux), so no blend.
  tag: computed
  calls:
  - K4
  - K14
  author: claude-opus-5.5
  at: '2026-10-27T06:22:54+00:00'
- id: C5
  text: 'Between ~days 47,900 and 48,300 the system was in an anomalous state: median V 10.47 (0.9 mag
    brighter than the later 11.37) with standstill-like intermediate brightness instead of clean quiescence/outburst
    cycles; normal outbursts resumed afterwards.'
  tag: computed
  calls:
  - K7
  - K11
  author: claude-opus-5.5
  at: '2026-10-27T06:22:55+00:00'
- id: C6
  text: 'NEOWISE W1-W2 ~0.09 and stable (range 0.06), with W1 only ~0.7 mag peak-to-peak: no warm-dust
    signature, so dust explanations are not supported.'
  tag: computed
  calls:
  - K13
  author: claude-opus-5.5
  at: '2026-10-27T06:22:56+00:00'
- id: C7
  text: Recent 150-d window medians of V are 11.17-11.44 (median dominated by quiescence); last outburst
    began ~day 49744, and at the cutoff (day 49787) the star is in quiescence at V~11.1-11.3 with sparse
    coverage (1-3 observers per bin, likely seasonal).
  tag: computed
  calls:
  - K6
  - K10
  - K12
  author: claude-opus-5.5
  at: '2026-10-27T06:22:57+00:00'
- id: C8
  text: 'Likely identity: SS Cygni (U Gem-type dwarf nova at ~114 pc, V 12->8.5, ~50 d recurrence, heavily
    observed for over a century, with a well-known anomalous standstill-like episode in recent years).'
  tag: speculated
  calls:
  - K1
  - K8
  - K11
  author: claude-opus-5.5
  at: '2026-10-27T06:22:57+00:00'

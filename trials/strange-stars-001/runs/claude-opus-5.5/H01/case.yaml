claims:
- id: C1
  text: Out of eclipse the star is very constant (V robust std 0.053 mag over decades, V~10.80-10.83);
    recent data days 19300-19798 hold V=10.78-10.83 with no dimming in progress at the cutoff.
  tag: observed
  calls:
  - K1
  - K7
  author: claude-opus-5.5
  at: '2026-10-27T06:21:30+00:00'
- id: C2
  text: 'Discrete fading events with minima near days 5840, 7890, 9940, ~11990, 14038, 16092 and ~18130
    (visual + V data): consecutive spacings 2050, 2050, 2050, 2048, 2054, 2038 d, i.e. strictly periodic
    recurrence with P ~2048-2050 d (~5.6 yr).'
  tag: computed
  calls:
  - K3
  - K4
  - K5
  - K6
  - K12
  - K13
  - K14
  author: claude-opus-5.5
  at: '2026-10-27T06:21:32+00:00'
- id: C3
  text: 'Each event lasts ~45-60 d with ~smooth, roughly symmetric ingress/egress and structure near minimum
    (e.g. day 18100-18158, plateau/two minima near 18128-18138); depths vary strongly from event to event:
    ~1.6 mag (day 9940), ~0.6 (day ~11990, visual), ~0.4 (14038), ~0.68 (16092), ~0.53 (18130).'
  tag: observed
  calls:
  - K5
  - K6
  - K12
  - K13
  - K14
  author: claude-opus-5.5
  at: '2026-10-27T06:21:33+00:00'
- id: C4
  text: 'The fading is nearly grey: dB/dV = 1.01-1.04 and dI/dV = 0.82-0.84 (r>0.98), much flatter than
    ISM dust (1.32, 0.59) - occulting material is large-grained or optically thick, not a normal-dust
    cloud and not pulsation/spots.'
  tag: computed
  calls:
  - K2
  - K10
  - K11
  author: claude-opus-5.5
  at: '2026-10-27T06:21:34+00:00'
- id: C5
  text: 'Gaia: d~2.3 kpc, abs G -1.15, BP-RP 0.66: a luminous, reddened early-type (likely B) star; all
    44 NEOWISE visits saturated (W1<8) implying V-W1>2.8, an IR excess for a hot star (circumstellar disk/dust).'
  tag: inferred
  calls:
  - K1
  - K2
  author: claude-opus-5.5
  at: '2026-10-27T06:21:36+00:00'
- id: C6
  text: Events are confirmed by 91 independent observers and multiple bands with observed ingresses; no
    Gaia neighbour contributes >1.5% of flux in any beam, so neither blend nor instrumental artifact explains
    them. TESS shows only ~0.3% variability with a 1.98 d period (tiny compared to the eclipses).
  tag: computed
  calls:
  - K2
  - K9
  author: claude-opus-5.5
  at: '2026-10-27T06:21:37+00:00'
- id: C7
  text: Periodic, long (~50 d out of 2050 d), grey, variable-depth eclipses of a luminous B star are the
    signature of an opaque dark disk around an unseen companion eclipsing the star, with disk precession/
    orientation changing the depth. This matches EE Cephei (P=2050 d) and I believe H01 is EE Cep, but
    the conclusion rests on the data above.
  tag: inferred
  calls:
  - K2
  - K5
  - K11
  - K14
  author: claude-opus-5.5
  at: '2026-10-27T06:21:39+00:00'

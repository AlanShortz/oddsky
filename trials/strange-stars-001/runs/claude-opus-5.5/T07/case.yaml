id: T07
title: Trial star T07
hook: ''
status: observation
summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: 'Gaia context: G=11.76, BP-RP=0.78, abs G=3.52 at ~444 pc, RUWE 0.82: a single-looking F-type
    main-sequence or slightly evolved dwarf. It is monitored unusually intensively: ~81k AAVSO V points
    from 89+ observers over ~4000 d, plus BVRI and TESS.'
  tag: observed
  calls:
  - K1
  author: claude-opus-5.5
  at: '2026-10-27T06:23:44+00:00'
- id: C2
  text: 'Over ~4000 d the V light curve is quiet at the 5% level: no excursion beyond max(4 sigma, 0.05
    mag) in 1-d bins, 2-98% amplitude 0.12 mag, and no secular trend (slope 0.0014 mag/yr). 10-d bin medians
    wander by a few hundredths of a magnitude, at least partly from changes in the observer mix.'
  tag: computed
  calls:
  - K3
  - K4
  - K5
  author: claude-opus-5.5
  at: '2026-10-27T06:23:45+00:00'
- id: C3
  text: A ~10-day dip of ~2.5% sits at days ~1405-1414. V is 0.025 mag fainter than the preceding window
    (31 sigma) and 0.024 mag fainter than the following window (36 sigma). The dip appears in B (0.020-0.025),
    I (0.020) and R (0.022, 2.3 sigma), so it is seen in several bands and by many observers (>1400 V
    points in the window).
  tag: computed
  calls:
  - K9
  - K10
  - K13
  - K11
  - K15
  - K14
  - K16
  author: claude-opus-5.5
  at: '2026-10-27T06:23:45+00:00'
- id: C4
  text: 'TESS shows a short, isolated ~1.3% dip at day ~1936.7, lasting ~0.8 d on a flat sector. Simultaneous
    AAVSO V bins at days 1936.9-1937.1 are ~0.03 mag fainter than the surrounding nights (compare_windows:
    0.037 mag, 22 sigma). So ground photometry independently confirms the TESS dip.'
  tag: observed
  calls:
  - K22
  - K27
  - K25
  author: claude-opus-5.5
  at: '2026-10-27T06:23:46+00:00'
- id: C5
  text: A blend is excluded for the dips. The nearest Gaia neighbour (1.8") supplies 0.46% of the G flux,
    and everything inside the AAVSO beam totals 0.5%, so no neighbour can make a 2-3% dip. The Skeptic
    finds no saturation and no momentum-dump coincidence for the TESS dip (Sb).
  tag: computed
  calls:
  - K2
  - K28
  author: claude-opus-5.5
  at: '2026-10-27T06:23:47+00:00'
- id: C6
  text: 'NEOWISE shows no warm-dust signature over ~3650 d: W1 is flat to 0.004 mag, W1-W2 ~ -0.03 (photospheric),
    there is no positive W1/W2 excess after day 1000, and W1 does not correlate with colour.'
  tag: computed
  calls:
  - K18
  - K19
  author: claude-opus-5.5
  at: '2026-10-27T06:23:47+00:00'
- id: C7
  text: The 0.17-0.27 mag B and I excursions found by find_excursions rest on only 1-3 observers per bin
    and are absent from the densely sampled V curve at the same epochs (e.g. days 2172-2324). They are
    most likely observer zero-point or calibration artifacts, not real dips.
  tag: inferred
  calls:
  - K6
  - K7
  - K5
  author: claude-opus-5.5
  at: '2026-10-27T06:23:48+00:00'
- id: C8
  text: An F star with no IR excess, no blend, and repeated, aperiodic, multi-band, independently confirmed
    few-percent dips lasting from ~1 d to ~10 d best fits occultation by circumstellar material (dust/debris
    clumps). Spots, pulsation and YSO disks fit poorly for an F dwarf with flat IR and a flat continuum
    between dips.
  tag: inferred
  calls:
  - K10
  - K13
  - K22
  - K25
  - K19
  - K28
  author: claude-opus-5.5
  at: '2026-10-27T06:23:49+00:00'
- id: C9
  text: The combination (F dwarf at ~450 pc, V~11.9, a faint neighbour at ~2" with ~0.5% flux, few-percent
    aperiodic dips with no IR excess, and an extraordinarily dense multi-observer AAVSO campaign) matches
    KIC 8462852 (Boyajian's star). This is recognition, not evidence; the conclusions above stand on the
    data alone.
  tag: speculated
  calls:
  - K1
  - K28
  - K2
  author: claude-opus-5.5
  at: '2026-10-27T06:23:50+00:00'
- id: C10
  text: There is no convincing periodicity. The V periodogram top peaks (1838 d, 1123 d) are comparable
    to the ~4000-d baseline and vulnerable to observer-mix trends. The TESS top peak (15.9 d) has very
    low power (0.027).
  tag: computed
  calls:
  - K29
  - K21
  author: claude-opus-5.5
  at: '2026-10-27T06:23:50+00:00'
hypotheses:
- id: H1
  klass: dust_occultation
  statement: Aperiodic few-percent dips of an F dwarf caused by circumstellar dust/debris clumps (optically
    thin, little total area, or cold) crossing the line of sight. No warm IR excess goes with them.
  supports:
  - C3
  - C4
  - C5
  - C6
  - C8
  - C10
  conflicts: []
  would_falsify: Dips shown to be strongly achromatic in a way inconsistent with any dust (needs >cm grains);
    a strict periodicity with identical eclipse shapes; or a matching warm IR excess forming first (would
    favour collision_debris).
  status: live
  confidence: 0.62
  author: claude-opus-5.5
  at: '2026-10-27T06:24:07+00:00'

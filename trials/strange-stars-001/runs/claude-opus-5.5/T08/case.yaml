claims:
- id: C1
  text: AAVSO V varies irregularly by ~2.6 mag (2-98%) over ~14 yr, with multi-hundred-day faint states
    (V~16.2-16.6, e.g. days 2050-2320 and 4250-4460) and bright states (V~14.0-14.7); no clean periodicity
    (top LS peaks 1116 d and 778 d in red-noise data).
  tag: observed
  calls:
  - K3
  - K5
  - K10
  author: claude-opus-5.5
  at: '2026-10-27T06:18:29+00:00'
- id: C2
  text: 'The variability is close to grey/achromatic and slightly bluer when fainter: dB/dV 0.83-0.95
    and dI/dV 0.85-0.93 versus ISM-dust expectations 1.32 and 0.59; bright-to-faint V drop 2.10 mag vs
    B drop 1.35 mag (few B points).'
  tag: computed
  calls:
  - K2
  - K7
  - K8
  - K21
  - K22
  author: claude-opus-5.5
  at: '2026-10-27T06:18:41+00:00'
- id: C3
  text: 'Gaia: d=135 pc, abs G 8.8 with BP-RP 2.54 although GSP-Phot Teff ~5900 K, implying several magnitudes
    of circumstellar/interstellar reddening and an underluminous (edge-on / scattered-light) appearance;
    RUWE 3.3 consistent with a photocentre disturbed by variability or companion.'
  tag: inferred
  calls:
  - K1
  - K2
  author: claude-opus-5.5
  at: '2026-10-27T06:18:42+00:00'
- id: C4
  text: 'All 42 NEOWISE visits are at or brighter than saturation (W1<8) while V~15.4, i.e. V-W1 > 7 mag,
    far beyond a reddened photosphere: a strong near/mid-IR excess (warm inner disk). WISE colours could
    not be measured because of saturation.'
  tag: inferred
  calls:
  - K2
  - K11
  author: claude-opus-5.5
  at: '2026-10-27T06:18:42+00:00'
- id: C5
  text: TESS shows large stochastic variability within sectors (robust std 0.10 mag, 0.67 mag 2-98 range),
    with a 0.8 mag, 1.3 d symmetric dip at day 5056 and short 0.5 mag brightenings/dips, plus a 4.2 d
    quasi-period (likely rotation/inner-disk corotation); not tied to momentum dumps or edges.
  tag: computed
  calls:
  - K9
  - K13
  - K15
  - K2
  author: claude-opus-5.5
  at: '2026-10-27T06:18:43+00:00'
- id: C6
  text: 'No blend explanation: no Gaia neighbour within the AAVSO or WISE beams; TESS neighbours contribute
    2.4% of the flux; 11+ independent AAVSO observers confirm the variability.'
  tag: computed
  calls:
  - K2
  - K20
  author: claude-opus-5.5
  at: '2026-10-27T06:18:44+00:00'
- id: C7
  text: The combination (young, reddened, IR-excess star at ~135 pc, grey extinction events on days-to-years
    timescales with blueing in deep minima, accretion-like short flares) is characteristic of a classical
    T Tauri dipper with an inclined inner disk, AA Tau-like; the star may be AA Tau itself in its post-2011
    dim state, though this identification is speculative.
  tag: speculated
  calls:
  - K1
  - K5
  - K7
  - K15
  author: claude-opus-5.5
  at: '2026-10-27T06:18:44+00:00'

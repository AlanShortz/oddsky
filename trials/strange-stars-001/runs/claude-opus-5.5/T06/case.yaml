summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: The AAVSO V record (409,667 points, 215 independent observers, ~60 yr) shows repeated brightenings
    of 3.3-3.8 mag from a floor near V~11.5-12.1 to V~8.5-9, each lasting ~5-18 days, recurring every
    few weeks.
  tag: observed
  calls:
  - K2
  - K3
  - K4
  - K6
  author: claude-opus-5.5
  at: '2026-10-27T06:22:03+00:00'
- id: C2
  text: Excursions are overwhelmingly brightenings with fast rises (typically 1-5 d) and slower declines
    (6-14 d), and are confirmed by 2-7 independent observers per bin - an eruptive, not occultation, morphology.
  tag: computed
  calls:
  - K6
  author: claude-opus-5.5
  at: '2026-10-27T06:22:04+00:00'
- id: C3
  text: 'The outbursts are quasi-periodic, not strictly periodic: the V periodogram over days 44000-47000
    shows a cluster of comparable peaks at 55.5, 68.2, 83.8 and 105.6 d rather than one sharp line; TESS
    shows a 50 d peak. Spacing in the day 48000-48400 window varies from ~25 to ~45 d.'
  tag: computed
  calls:
  - K11
  - K2
  - K4
  author: claude-opus-5.5
  at: '2026-10-27T06:22:04+00:00'
- id: C4
  text: All bands move together (skeptic r~0.98 for B, R, I vs V; cross_band dB/dV=1.01, dI/dV=0.57),
    and the variability is brightening above a quiescent floor, which dust extinction cannot produce.
    NEOWISE W1-W2 stays ~0.05-0.12 with no warm-dust excess.
  tag: computed
  calls:
  - K2
  - K7
  - K8
  - K9
  author: claude-opus-5.5
  at: '2026-10-27T06:22:06+00:00'
- id: C5
  text: 'Gaia: d=113 pc, abs G 6.4, Teff 5580 K (too faint for a G star of that colour; consistent with
    a K-type secondary plus accretion light), RUWE 2.33 suggesting binarity or variability-shifted photocentre.
    No Gaia source within 5 arcsec; NEOWISE neighbour contributes 1% of G flux, so no blend can produce
    3.7 mag outbursts.'
  tag: computed
  calls:
  - K1
  - K2
  author: claude-opus-5.5
  at: '2026-10-27T06:22:07+00:00'
- id: C6
  text: The median V brightened by ~1.0 mag after ~day 47100 (11.90 -> 10.92, changepoint at day 47106),
    with brighter quiescent levels (~11.0-11.5) and more frequent outbursts; NEOWISE W1 also brightened
    from ~9.2 to ~8.45-8.9 in the same era.
  tag: computed
  calls:
  - K3
  - K5
  - K16
  - K10
  author: claude-opus-5.5
  at: '2026-10-27T06:22:08+00:00'
- id: C7
  text: 'TESS fadings of 1.7-2.3 mag at days ~48522 and ~48534 are instrumental: simultaneous multi-observer
    AAVSO V stays at quiescent 11.3-11.7 at those times, and the skeptic places TESS dips at momentum
    dumps/orbit edges. Real TESS outbursts (e.g. days 47440, 49058, 49256) coincide with AAVSO behaviour.'
  tag: observed
  calls:
  - K13
  - K14
  - K15
  - K2
  author: claude-opus-5.5
  at: '2026-10-27T06:22:09+00:00'
- id: C8
  text: 'Recurrent 3.5-4 mag outbursts every ~30-100 d, fast rise/slow decline, a cool-star-dominated
    quiescent spectrum and a nearby (113 pc) underluminous source indicate a U Gem-type dwarf nova: a
    white dwarf accreting from a K dwarf via a disk with thermal-instability outbursts.'
  tag: inferred
  calls:
  - K6
  - K11
  - K1
  author: claude-opus-5.5
  at: '2026-10-27T06:22:10+00:00'
- id: C9
  text: 'This looks like SS Cygni (the brightest/most observed dwarf nova: V~12 to ~8.5, ~50 d outburst
    cycle, Gaia distance ~114 pc, K-type secondary); the post-day-47100 brighter state would match its
    reported anomalous behaviour in recent years.'
  tag: speculated
  calls:
  - K1
  - K3
  - K16
  author: claude-opus-5.5
  at: '2026-10-27T06:22:11+00:00'

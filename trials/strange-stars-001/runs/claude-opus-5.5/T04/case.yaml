  klass: dust_formation
  statement: 'R Coronae Borealis-type star: a hydrogen-deficient supergiant that sporadically condenses
    carbon dust near its photosphere, producing sudden, irregular 5-8 mag declines with slow recoveries,
    including a decade-long deep minimum. Likely R CrB itself (240-yr visual record, max V~5.8-6, 2007-2017-like
    deep minimum).'
  supports:

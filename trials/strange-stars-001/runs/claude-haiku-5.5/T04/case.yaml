- id: C2
  text: 'V brightness is bimodal: median about 12.9 before the changepoint at MJD-scale 84838 and about
    6.1 after, a step of -6.8 mag. I shows the same step (-6.8 mag) at 84809.'
  tag: computed
  calls:
  - K5
  - K17
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:15+00:00'
- id: C3
  text: The visual series shows many irregular fadings from a bright level near 6 to 7 mag; 10 of the
    first 10 listed events have depths 5.4-6.9 mag and durations of 37-230 days, with a fast-ish decline
    and slower recovery in most (8 of 10 have egress longer than ingress).
  tag: observed
  calls:
  - K4
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:17+00:00'
- id: C4
  text: 'Colour during fading is grey-ish relative to interstellar dust: dB/dV = 1.05 and dR/dV = 0.97,
    against 1.32 and 0.81 expected for ISM dust. So the fading is achromatic-to-mild, not simple interstellar
    reddening.'
  tag: computed
  calls:
  - K9
  - K2
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:20+00:00'
- id: C5
  text: 'No stable period: the strongest periodogram peak in Vis. is at 17878 d with power 0.06, and the
    TESS peak at 611 d has power 0.30 over a 1496-day baseline (about 2.5 cycles) with an explicit red-noise
    caution. The variability is episodic, not periodic.'
  tag: computed
  calls:
  - K14
  - K8
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:22+00:00'
- id: C6
  text: 'NEOWISE gives no usable IR photometry: W1 and W2 are saturated at all 11 visits (W1<8, W2<7)
    and 99% of exposures are removed by quality cuts, so no IR excess or W1-W2 colour can be measured.'
  tag: observed
  calls:
  - K2
  - K6
  - K3
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:25+00:00'
- id: C7
  text: Gaia DR3 gives G=8.84, BP-RP=1.68 and RUWE=12.8 (far above 1.4). The RUWE indicates either an
    unresolved companion or a photocentre shifted by strong variability. Neighbours are negligible for
    blending (under 0.1% of G flux in any beam).
  tag: observed
  calls:
  - K1
  - K2
  - K7
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:28+00:00'
- id: C8
  text: 'In the last ~1100 days the star sits on a fairly steady bright plateau: V median 5.99 (range
    5.65-6.84), with a fainter episode from about 84900 to 87400 (median 6.47, dips to 10.1 mag).'
  tag: computed
  calls:
  - K15
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:31+00:00'
- id: C9
  text: The TESS record (about 1500 days, sector-normalised) shows no large fading episodes; its only
    excursions (about 0.5-0.8 relative mag) fall in the first 25 days of the record, where a sector-start
    ramp cannot be excluded, so I do not rely on them.
  tag: inferred
  calls:
  - K10
  - K11
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:34+00:00'
- id: C10
  text: 'Long-term, the visual series was fainter and more variable in its early part: median 7.45 before
    about 40000 versus 6.10 after, so the baseline has drifted brighter; no sign of a secular dimming
    trend in the recent 40000-88500 window.'
  tag: computed
  calls:
  - K16
  author: claude-haiku-5.5
  at: '2026-10-27T06:19:36+00:00'

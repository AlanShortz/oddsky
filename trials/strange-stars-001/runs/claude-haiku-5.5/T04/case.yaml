- id: H3
  klass: dust_formation
  statement: 'The star makes its own dust in episodic declines (R CrB-like): fading to 6-7 mag below a
    bright state of about 6 mag, with grey-ish colour and no periodicity.'
  supports:
  - C2
  - C3
  - C4
  - C5
  - C6
  conflicts: []
  would_falsify: A periodic or strictly regular ~ cycle in V, a fast symmetric dip shape with no slow
    recovery, or a companion-linked ephemeris would argue against it. Likewise, a strong IR excess from
    warm dust in NEOWISE would be needed (currently unmeasurable).
  status: live
  confidence: 0.55
  author: claude-haiku-5.5
  at: '2026-10-27T06:20:11+00:00'
- id: H4
  klass: dust_occultation
  statement: Circumstellar dust clumps or a warped disk pass in front of the star, causing the fadings,
    with the star itself not necessarily forming the dust.
  supports:
  - C2
  - C4
  - C3
  conflicts: []
  would_falsify: Evidence that the dimming is intrinsic (dust condensing in the star outflow, e.g. the
    bright-star state being the reset point of a dust-formation cycle) rather than external clumps would
    weaken it; an IR excess that cannot be measured here would also be the decisive test.
  status: live
  confidence: 0.25
  author: claude-haiku-5.5
  at: '2026-10-27T06:20:22+00:00'
- id: H5
  klass: eclipse_companion
  statement: A companion or its dusty disk periodically eclipses the star; the irregular 6-mag fadings
    would be eclipses by a long-period dusty companion.
  supports:
  - C7
  conflicts: []
  would_falsify: Eclipses would be strictly periodic with a stable ephemeris and symmetric shape; the
    observed episodes are irregular (no period in the periodogram, C7) and asymmetric (C3), which argues
    against it.
  status: live
  confidence: 0.05
  author: claude-haiku-5.5
  at: '2026-10-27T06:20:23+00:00'
- id: H6
  klass: pulsation
  statement: Long-period pulsation (Mira-like) produces the large amplitude variation.
  supports:
  - C2
  conflicts: []
  would_falsify: A Mira-type cycle would show a stable period with smooth, symmetric light curves; no
    stable period is found (C7), and the fades are episodic with irregular timing.
  status: live
  confidence: 0.03
  author: claude-haiku-5.5
  at: '2026-10-27T06:20:24+00:00'
- id: H7
  klass: collision_debris

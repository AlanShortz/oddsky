id: T08
title: Trial star T08
hook: ''
status: observation
summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: 'The TESS record (1588 days) has only three events above the 0.4-mag threshold: a fainter event
    of depth 0.81 mag lasting 1.3 d with symmetric ingress (0.68 d) and egress (0.62 d) at MJD-scale 5056,
    and a brightening of 0.49 mag lasting 0.26 d plus a 0.48-mag dip lasting 0.28 d at about 5065-5066.'
  tag: observed
  calls:
  - K4
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:18+00:00'
- id: C2
  text: 'TESS shows stochastic sub-day variability: 30-minute bins scatter by 0.10 mag (noise_mag 0.0997),
    far above the per-point error of 0.008 mag, so the scatter is real or systematic at the bin level
    rather than photon noise.'
  tag: computed
  calls:
  - K4
  - K1
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:18+00:00'
- id: C3
  text: The TESS periodogram has its strongest peak at 4.20 d (power 0.15), with neighbouring peaks at
    4.10, 3.50 and 5.74 d. The alias check finds no known Earth or survey rhythm, but the peak cluster
    is broad and red noise is not excluded.
  tag: computed
  calls:
  - K3
  - K2
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:19+00:00'
- id: C4
  text: 'The V series (1525 points over 5132 days) is large-amplitude and slowly fading: median 15.35,
    2-98 percentile range 2.6 mag, slope +0.044 mag/yr, and a changepoint step of +0.63 mag (fainter)
    at about 1882 days. No discrete dips or brightenings are found above the 0.4-mag threshold.'
  tag: observed
  calls:
  - K6
  - K7
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:20+00:00'
- id: C5
  text: The V periodogram peaks at 1116 d (power 0.26) and 778 d (power 0.21), but the 5132-day baseline
    holds only about 4.6 cycles of the strongest peak. Long-period, possibly quasi-periodic, large-amplitude
    variability is suggested; a clean period is not established.
  tag: computed
  calls:
  - K9
  - K2
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:20+00:00'
- id: C6
  text: 'V and I move together: Pearson r = 0.87 and slope 0.85 over 602 pairs, with V-I about 2.5 mag
    (V median 15.35, I median 12.84). The skeptic chromatic check warns that B and R do not all track
    V, so the colour test is only partly reassuring.'
  tag: computed
  calls:
  - K8
  - K2
  - K6
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:21+00:00'
- id: C7
  text: 'NEOWISE gives no usable infrared: all 42 W1/W2 visits are at or brighter than the saturation
    limit, and quality cuts remove up to 29 percent of exposures; no visit has both bands after cuts.
    The infrared excess cannot be measured here.'
  tag: observed
  calls:
  - K2
  - K5
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:22+00:00'
- id: C8
  text: Gaia DR3 gives G = 14.42, BP-RP 2.54, RUWE 3.33 (above 1.4, so an unresolved companion or variability-shifted
    photocentre is likely), parallax/error 86, and an uncorrected absolute G of 8.8. Gaia epoch photometry
    spans 2.3 mag in G with a standard deviation of 0.68 mag.
  tag: observed
  calls:
  - K1
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:22+00:00'
- id: C9
  text: 'Blending is unlikely to be the source of the large amplitude: no Gaia source lies within 5 arcsec,
    the brightest of the three sources within 42 arcsec contributes only 1.7 percent of G flux, and TESS
    CROWDSAP is 0.98.'
  tag: computed
  calls:
  - K2
  - K10
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:23+00:00'
hypotheses:
- id: H1
  klass: yso_dipper
  statement: 'A young, reddened star with an inner disk: stochastic sub-day dips and brightenings (accretion
    or disk occultation), a rotation-like 4-d period, and slow multi-year fading from changing extinction.'
  supports:
  - C1
  - C2
  - C3
  - C4
  - C6
  - C8
  conflicts: []
  would_falsify: Dipper dips are quasi-periodic at the rotation period; a single 1-d dip with no repeats
    in 1588 d of TESS (C1) and a 5000-day secular step (C4) argue against a pure dipper. A young-star
    test (IR excess, which NEOWISE cannot provide) would decide it; a clear non-YSO IR signature would
    falsify it.
  status: live
  confidence: 0.5
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:37+00:00'
- id: H2
  klass: dust_occultation
  statement: Circumstellar dust clumps or a disk warp in front of the star cause the large V fading and
    colour changes, without the star forming dust itself.
  supports:
  - C4
  - C6
  conflicts: []
  would_falsify: A steady fading without colour-dependent extinction (V and I move together with slope
    0.85) and a colour that does not redden as the star fades would weaken it.
  status: live
  confidence: 0.1
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:39+00:00'
- id: H3
  klass: eruptive
  statement: Flares or outbursts from an active red star or accretion bursts produce the TESS brightenings
    and dips.
  supports:
  - C1
  conflicts: []
  would_falsify: Flares show a fast rise and slow decay (asymmetry near -1 or +1); the TESS events here
    are nearly symmetric (asymmetry -0.05, 0.05), and the V fading is not an outburst. Asymmetric flare
    profiles at higher cadence would support it.
  status: live
  confidence: 0.09
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:42+00:00'
- id: H4
  klass: rotation_spots
  statement: Starspots on an active star with a 4-d rotation period produce the TESS periodicity; the
    large optical fading is separate.
  supports:
  - C2
  - C3
  conflicts: []
  would_falsify: Spot modulation is at the few-percent level and does not produce 0.8-mag events or 2.6-mag
    V swings; the spot explanation does not account for C1 or C4.
  status: live
  confidence: 0.06
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:43+00:00'
- id: H5
  klass: pulsation
  statement: A long-period, large-amplitude pulsator (Mira or semi-regular type) with a period near 1100
    days and a 2.6-mag V range.
  supports:
  - C5
  conflicts: []
  would_falsify: A Mira or semi-regular would show smooth, cyclic light curves; the sub-day TESS stochastic
    scatter (C2) and the non-cyclic changepoint behaviour (C4) argue against it; Gaia does not classify
    it as long-period variable.
  status: live
  confidence: 0.06
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:45+00:00'
- id: H6
  klass: eclipse_companion
  statement: A companion or its disk eclipses the star; the RUWE of 3.3 is consistent with binarity.
  supports:
  - C1
  - C8
  conflicts: []
  would_falsify: Eclipses would repeat with a stable ephemeris; only one 1.3-day dip is found in 1588
    days of TESS (C1), with no repeats.
  status: live
  confidence: 0.05
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:47+00:00'
- id: H7
  klass: collision_debris
  statement: Debris from a collision produces dust extinction episodes, with an IR excess first.
  supports:
  - C4
  conflicts: []
  would_falsify: Collision debris would show an IR excess; NEOWISE gives no usable IR (C7), so this class
    is untested rather than supported.
  status: live
  confidence: 0.04
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:49+00:00'
- id: H8
  klass: dust_formation
  statement: The star forms its own dust, with fading episodes like R CrB or AGB-type dust events.
  supports:
  - C4
  conflicts: []
  would_falsify: A fading without the rapid R CrB-style declines and the sub-day TESS scatter (C2) is
    inconsistent with a classical dust-forming star; an IR excess test (unavailable here) would also be
    decisive.
  status: live
  confidence: 0.04
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:51+00:00'
- id: H9
  klass: artifact_instrumental
  statement: Calibration or pipeline artefacts (band-specific offsets, flagged points, sector normalisation)
    produce the apparent V fading or the TESS scatter.
  supports:
  - C4
  - C6
  conflicts: []
  would_falsify: A consistent V fading across 11 observers and a V-I coupling that holds across observers
    (C4, C6) argue against an instrumental origin; the skeptic warns on calibration for one band, so this
    is only partly tested.
  status: live
  confidence: 0.03
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:52+00:00'
- id: H10
  klass: artifact_blend
  statement: A neighbour star is the source of the large variability.
  supports:
  - C9
  conflicts: []
  would_falsify: The neighbours within 5 arcsec are absent and the largest contributor in the TESS aperture
    is 1.7 percent of target flux; a 0.8-mag event cannot come from that flux without a huge amplitude
    neighbour.
  status: live
  confidence: 0.02
  author: claude-haiku-5.5
  at: '2026-10-27T06:25:53+00:00'
- id: H11
  klass: normal
  statement: Nothing to explain at the precision of the data.
  supports: []
  conflicts: []
  would_falsify: Any 0.8-mag event or 2.6-mag long-term variation (C1, C4) falsifies it.
  status: live
  confidence: 0.01

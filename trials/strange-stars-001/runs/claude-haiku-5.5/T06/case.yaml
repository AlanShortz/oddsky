summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: 'Gaia DR3: G=11.67, BP-RP=1.18, Teff about 5583 K, abs G 6.4, distance 113 pc, RUWE 2.33 (above
    1.4, possible unresolved companion), and no Gaia long-period or eclipsing variability classification.'
  tag: observed
  calls:
  - K1
  - K2
  author: claude-haiku-5.5
  at: '2026-10-27T06:24:37+00:00'
- id: C2
  text: The V series (409,667 points, 215 observers) contains 165 brightening events by the find_excursions
    rule (the tool returned only the top 20). The top 20 are all brightenings of 3.5-3.8 mag above a ~12.0
    running baseline, lasting 4-17 d, with slow rise (1-6 d) and slow decline (5-13 d), and up to 5 independent
    observers per bin. Dimming events are not listed.
  tag: computed
  calls:
  - K5
  author: claude-haiku-5.5
  at: '2026-10-27T06:24:38+00:00'
- id: C3
  text: 'No stable period: the V periodogram (0.2-2000 d) peaks weakly at 55.7 d (power 0.21), with aliases
    at 48.4 and 49.7 d; none is a known survey or Earth rhythm, and the peaks are of similar low power,
    so the variability is irregular rather than periodic.'
  tag: computed
  calls:
  - K3
  author: claude-haiku-5.5
  at: '2026-10-27T06:24:38+00:00'
- id: C4
  text: 'The colours move together with V: chromatic check dB/dV=1.18 (ISM 1.32), dR/dV=0.82 (ISM 0.81),
    dI/dV=0.67 (ISM 0.59), each band correlated with V at r=0.98. The brightening is seen in every band
    at once, so it is not a single-band calibration effect.'
  tag: computed
  calls:
  - K2
  author: claude-haiku-5.5
  at: '2026-10-27T06:24:39+00:00'
- id: C5
  text: NEOWISE W1 varies only 0.17 mag (robust std), with W1-W2 about 0.09 across 20 visits, close to
    a photosphere. W1 is uncorrelated with V (cross-band r=-0.10 over 16,437 pairs), so the optical events
    do not come with a warm dust excess. The IR excess over 2000-day baselines is about 21% of the photosphere
    in W1 and 22% in W2, a slow drift rather than an event-linked excess.
  tag: computed
  calls:
  - K6
  - K8
  - K9
  author: claude-haiku-5.5
  at: '2026-10-27T06:24:40+00:00'
- id: C6
  text: TESS shows no excursions by find_excursions (0 events, noise 0.6 relative), and the skeptic warns
    on crowding (CROWDSAP 0.84, 16% of aperture flux not the target) and WISE saturation (1 of 42 visits
    at W1<8). TESS is therefore not a usable independent check of these outbursts on this bright star.
  tag: computed
  calls:
  - K7
  - K2
  author: claude-haiku-5.5
  at: '2026-10-27T06:24:40+00:00'
- id: C7
  text: 'Blend checks pass for the optical beam: no Gaia source within 5 arcsec of the target, and the
    nearest source at 5.3 arcsec contributes 1.0% of G flux inside the W1 beam. A neighbour cannot supply
    3.7-mag optical brightenings seen by several observers, so the events are not from a blend.'
  tag: computed
  calls:
  - K2
  author: claude-haiku-5.5
  at: '2026-10-27T06:24:41+00:00'

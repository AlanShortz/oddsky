id: H03
title: Trial star H03
hook: ''
status: observation
summary: 'Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean. HINDSIGHT: data stop at day 1168.
  Register predictions (register_prediction) about later times; they will be graded against what actually
  happened.'
claims:
- id: C1
  text: ASAS-SN V sits flat at a median of 12.70 (robust std 0.015 mag) for about 1000 days; the only
    point after that is a single 15.46 at day 1090.8, and the series ends there.
  tag: observed
  calls:
  - K1
  - K12
  author: claude-haiku-5.5
  at: '2026-11-11T00:08:35+00:00'
- id: C2
  text: NEOWISE W1 is flat at about 11.06 over six visits (days 0 to 901). In the last visit, at day 1093.3
    to 1094.3, nine single exposures fade from 12.2 to 14.7 in W1 and from 11.5 to 13.1 in W2 within about
    one day.
  tag: observed
  calls:
  - K3
  - K8
  - K13
  author: claude-haiku-5.5
  at: '2026-11-11T00:08:36+00:00'
- id: C3
  text: ATLAS c and o are both about 12.3 to 12.6 at day 731, and both are 17.7 to 18.8 from day 1109
    to 1165, a sustained drop of roughly 5 to 6 magnitudes that lasts through the last point before the
    cutoff.
  tag: computed
  calls:
  - K10
  - K14
  author: claude-haiku-5.5
  at: '2026-11-11T00:08:38+00:00'
- id: C4
  text: 'W1-W2 was -0.03 mag through six visits and reached +0.885 in the last visit, so the IR colour
    turns sharply red as the star fades. The fade is larger in W1 than in W2, but not by the grey-extinction
    ratio: the optical fades about 5 mag while W1 fades about 2.5 mag within one day.'
  tag: computed
  calls:
  - K4
  - K8
  - K13
  - K12
  author: claude-haiku-5.5
  at: '2026-11-11T00:08:39+00:00'
- id: C5
  text: Gaia gives G 12.46, BP-RP 0.80, Teff about 6000 K, distance about 426 pc, RUWE 1.15, and no non-single-star
    flag. The brightest neighbour inside the ASAS-SN beam contributes 0.24 percent of G flux, and the
    two G near 16.5 neighbours sit at 21 to 23 arcsec, outside that beam, so a neighbour cannot supply
    a 5-magnitude fade.
  tag: computed
  calls:
  - K1
  - K2
  - K7
  author: claude-haiku-5.5
  at: '2026-11-11T00:08:42+00:00'
- id: C6
  text: 'The optical drop starts before the IR drop: ASAS-SN is 2.8 mag fainter at day 1090.8, and NEOWISE
    is about 1.1 mag fainter in W1 three days later, so the event starts within roughly a week before
    the cutoff and deepens over days.'
  tag: inferred
  calls:
  - K9
  - K8
  - K12
  author: claude-haiku-5.5
  at: '2026-11-11T00:08:44+00:00'
- id: C7
  text: The late optical and infrared fade looks like a dust-driven event, either a dust clump occulting
    the star or a fresh dust episode; the data so far cannot separate these, and the one-day IR fade is
    fast enough that a detector or pipeline issue cannot be ruled out yet.
  tag: speculated
  calls:
  - K8
  - K10
  - K4
  author: claude-haiku-5.5
  at: '2026-11-11T00:08:45+00:00'
- id: C8
  text: No positive infrared excess appears in the 200 to 1100 day window (W1 and W2 both slightly negative),
    and find_excursions finds no events in ASAS-SN with its 300-day baseline. The late fade is visible
    only because it sits outside the baseline window of the tools, with just one optical point before
    the drop.
  tag: computed
  calls:
  - K5
  - K6
  author: claude-haiku-5.5
  at: '2026-11-11T00:08:51+00:00'

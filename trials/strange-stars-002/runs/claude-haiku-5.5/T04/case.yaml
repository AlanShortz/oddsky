id: T04
title: Trial star T04
hook: ''
status: observation
summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: 'NEOWISE W1 is flat over 3804 d: median 9.969, robust std 0.003 mag, 2-98 amplitude 0.008 mag,
    slope 0.0004 mag/yr, no significant step.'
  tag: observed
  calls:
  - K4
  author: claude-haiku-5.5
  at: '2026-11-11T00:06:51+00:00'
- id: C2
  text: 'TESS is quiet at the 0.07 percent level: robust std 0.0007, 2-98 amplitude 0.36 percent, and
    no dip or brightening passes the 4-sigma / 0.05 mag excursion test.'
  tag: computed
  calls:
  - K3
  - K6
  author: claude-haiku-5.5
  at: '2026-11-11T00:06:53+00:00'
- id: C3
  text: W1-W2 is constant at about -0.055 mag across 17 visits (range 0.028 mag), and the excess-over-baseline
    test gives zero excess in both bands. No warm dust signature.
  tag: computed
  calls:
  - K7
  - K8
  author: claude-haiku-5.5
  at: '2026-11-11T00:06:55+00:00'
- id: C4
  text: TESS periodogram peaks at 6.01 d (power 0.0038, white-noise FAP 7e-8), but the folded light curve
    at that period shows only about 0.0002 mag of phase structure against 0.0007 scatter, so the periodicity
    is marginal in amplitude and the FAP assumes white noise.
  tag: computed
  calls:
  - K5
  - K10
  author: claude-haiku-5.5
  at: '2026-11-11T00:06:57+00:00'
- id: C5
  text: 'Skeptic checks pass: no Gaia neighbour inside the 6.1 arcsec NEOWISE beam, brightest TESS-beam
    neighbour contributes 0.35 percent of G flux, CROWDSAP 0.98, no WISE saturation, RUWE 0.91. The only
    warning is that no second optical instrument confirms the signal.'
  tag: computed
  calls:
  - K2
  - K9
  author: claude-haiku-5.5
  at: '2026-11-11T00:06:58+00:00'
- id: C6
  text: 'Gaia gives G 11.46, BP-RP 0.85, Teff about 5760 K, distance about 215 pc, absolute G about 4.8:
    a Sun-like main-sequence dwarf with no sign of non-single-star behaviour.'
  tag: inferred
  calls:
  - K1
  author: claude-haiku-5.5
  at: '2026-11-11T00:06:59+00:00'
- id: C7
  text: If the 6-day TESS peak is real, a spot-modulated Sun-like dwarf is the ordinary reading; the folded
    amplitude is far below the 0.36 percent 2-98 range, so the modulation is speculated, not measured.
  tag: speculated
  calls:
  - K5
  - K10
  author: claude-haiku-5.5
  at: '2026-11-11T00:07:01+00:00'
- id: C8
  text: No dust, no eclipse-like events and no achromatic brightening appear in either the optical or
    the infrared data, so the dust, eruptive and microlensing classes have no positive support.
  tag: inferred
  calls:
  - K3
  - K6
  - K8
  author: claude-haiku-5.5
  at: '2026-11-11T00:07:03+00:00'

id: H04
title: Trial star H04
hook: ''
status: observation
summary: 'Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean. HINDSIGHT: data stop at day 1730.
  Register predictions (register_prediction) about later times; they will be graded against what actually
  happened.'
claims:
- id: C1
  text: 'ASAS-SN V is flat through the data: robust std 0.036 mag, slope -0.003 mag/yr, no excursion above
    4 sigma or 0.05 mag in 1-day bins; a 0.05 mag brightening step near MJD 1513 is significant at 7 sigma
    but small.'
  tag: computed
  calls:
  - K3
  - K4
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:22+00:00'
- id: C2
  text: Gaia G is flat at 13.52 mag across 2014-2017 (robust std 0.010 mag, no excursions), RUWE 1.02,
    single-star-like astrometry.
  tag: observed
  calls:
  - K1
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:23+00:00'
- id: C3
  text: 'Before MJD 1460 the mid-infrared is photospheric: NEOWISE W1-W2 is about -0.07 mag over nine
    visits and no positive W1/W2 excess is found over MJD 200-1730 excluding the last visit.'
  tag: computed
  calls:
  - K5
  - K6
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:24+00:00'
- id: C4
  text: 'At the final visit (MJD 1621) the star is brighter in the mid-infrared: W1 10.99 (+0.20 mag vs
    baseline 11.19) and W2 10.82 (+0.45 mag), so W1-W2 rises from about -0.07 to +0.17; the excess has
    a two-band colour temperature near 990 K.'
  tag: observed
  calls:
  - K9
  - K10
  - K14
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:25+00:00'
- id: C5
  text: 'The mid-IR brightening is sustained over at least 9 days: 18 single exposures from MJD 1620.5
    to 1629.8 stay at W1 about 10.97 to 11.02 and W2 about 10.80 to 10.85, so it is not a single bad exposure.'
  tag: observed
  calls:
  - K11
  - K12
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:26+00:00'
- id: C6
  text: 'The optical does not dim during the infrared brightening: ASAS-SN V in MJD 1600-1660 is 0.04
    mag brighter than in MJD 1000-1500 (4 sigma); no optical extinction has appeared by the cutoff.'
  tag: computed
  calls:
  - K13
  - K15
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:27+00:00'
- id: C7
  text: No Gaia source lies within the 6.1 arcsec WISE beam, so the late infrared brightening cannot be
    a neighbour inside the same WISE beam; the neighbours inside the 16 arcsec ASAS-SN beam contribute
    about 20 percent of the optical flux, which dilutes optical amplitudes.
  tag: computed
  calls:
  - K2
  - K7
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:28+00:00'
- id: C8
  text: The star is a cool main-sequence or subgiant-like K star (Teff about 4770 K, absolute G 6.55,
    about 250 pc) with no AGB or luminous-star signature, so a dust-producing AGB or post-AGB episode
    is unlikely.
  tag: inferred
  calls:
  - K1
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:29+00:00'

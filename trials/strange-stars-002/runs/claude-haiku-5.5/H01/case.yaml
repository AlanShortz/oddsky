id: H01
title: Trial star H01
hook: ''
status: observation
summary: 'Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean. HINDSIGHT: data stop at day 3033.
  Register predictions (register_prediction) about later times; they will be graded against what actually
  happened.'
claims:
- id: C1
  text: The ATLAS o-band median is 16.99 with robust scatter 0.125; the series has a changepoint at MJD
    1973 where it steps 0.16 mag brighter (18.6 sigma), then fades slowly to about 16.94 before brightening
    again.
  tag: computed
  calls:
  - K3
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:10+00:00'
- id: C2
  text: ATLAS c and o track each other (Pearson r = 0.73, slope 1.05, 89 pairs within 1 day), so the variability
    is roughly achromatic across the two bands.
  tag: computed
  calls:
  - K9
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:11+00:00'
- id: C3
  text: At the end of the data the ATLAS o series brightens by about 0.35 mag from about 16.7 at MJD 2990
    to 16.35 at MJD 3025 (a 146-point window median of 16.63 against 16.96 before 2900), and the last
    point is 16.39 at MJD 3028; the rise is still in progress at the cutoff.
  tag: observed
  calls:
  - K11
  - K5
  - K13
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:12+00:00'
- id: C4
  text: NEOWISE W1-W2 is about -0.16 with no trend (range 0.10 mag) and W1 and W2 are flat across 2917
    days; the excess above the photosphere is about 1.4 percent, not significant, so no infrared dust
    signature is seen.
  tag: computed
  calls:
  - K7
  - K8
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:13+00:00'
- id: C5
  text: A Gaia source 6.1 arcsec away (G = 18.09) supplies 37 percent of the target G flux and the 8 arcsec
    ATLAS aperture contains two Gaia sources, so the variability may partly belong to a neighbour; the
    target is blended.
  tag: computed
  calls:
  - K2
  - K6
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:14+00:00'
- id: C6
  text: The 1.00 d periodogram peak coincides with the survey window and the longer peaks (about 410 d,
    794 d) are aliases of that 1-day window, so no reliable period is established.
  tag: computed
  calls:
  - K10
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:15+00:00'
- id: C7
  text: 'Whether the late brightening is smooth and achromatic like a lens passage or a neighbour-driven
    or systematic change cannot be decided from these tools: the lens_fit call failed with a data-key
    error.'
  tag: inferred
  calls:
  - K3
  - K9
  - K5
  author: claude-haiku-5.5
  at: '2026-11-11T00:09:16+00:00'

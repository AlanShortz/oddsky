claims:
- id: C1
  text: Out of eclipse the star is constant to ~0.01 mag in ZTF r over 2750 d and ~0.005 mag in Gaia G;
    the running-baseline excursion finder sees no long events. All faint points are isolated, hours-long.
  tag: observed
  calls:
  - K1
  - K3
  - K4
  - K5
  author: claude-fable-5.2
  at: '2026-11-11T00:13:06+00:00'
- id: C2
  text: The faint points in ZTF r, ZTF g and Gaia G all fall at one phase of a 2.38016 d period (score
    0.92, 21 cycles sampled over ~4050 d); event width ~0.045 in phase (~2.5 h).
  tag: computed
  calls:
  - K6
  - K7
  - K8
  author: claude-fable-5.2
  at: '2026-11-11T00:13:07+00:00'
- id: C3
  text: 'Folding at twice the period (4.76032 d) shows deep events at both half-phases with indistinguishable
    maximum depth (r 0.92 vs 0.90; g 0.90 vs 1.03; G 0.87 vs 0.89; W1 0.68 vs 0.57 mag). No secondary
    at phase 0.5 of 2.38 d (r: 0.001-0.004 +/- 0.003).'
  tag: computed
  calls:
  - K9
  - K10
  - K11
  - K13
  - K15
  - K17
  - K18
  - K19
  author: claude-fable-5.2
  at: '2026-11-11T00:13:08+00:00'
- id: C4
  text: The events are seen by four independent instruments (ZTF r and g, Gaia G/BP/RP, NEOWISE single
    exposures), with depth ~0.9 mag in the optical and ~0.6 mag at 3.4 micron; no Gaia neighbour within
    7 arcsec and that one is 6.6 mag fainter. So the dimming is real and belongs to this star.
  tag: inferred
  calls:
  - K1
  - K2
  - K17
  - K21
  author: claude-fable-5.2
  at: '2026-11-11T00:13:09+00:00'
- id: C5
  text: 'No infrared excess or colour change: W1-W2 = -0.06 constant, uncorrelated with W1; visit-mean
    W1 stable to 0.007 mag over 3650 d. No warm dust.'
  tag: computed
  calls:
  - K22
  - K1
  author: claude-fable-5.2
  at: '2026-11-11T00:13:10+00:00'
- id: C6
  text: 'Gaia: Teff ~4980 K, abs G 5.56 at 521 pc, RUWE 1.05. A single K2 dwarf would be ~0.5 mag fainter,
    consistent with two similar stars. A strictly periodic, stable, sharp ~0.9 mag event every 2.38 d
    (or two near-equal events per 4.76 d) is a detached eclipsing binary of late-type dwarfs, near edge-on.'
  tag: inferred
  calls:
  - K1
  - K7
  - K11
  author: claude-fable-5.2
  at: '2026-11-11T00:13:11+00:00'
- id: C7
  text: A depth of ~0.9 mag exceeds the 0.75 mag limit for identical twins, and is shallower in W1 than
    in g; possibly a slightly unequal pair with total eclipses at P=4.76 d, or a larger cooler (e.g. inflated/pre-main-sequence)
    companion. Not resolved by these data.
  tag: speculated
  calls:
  - K11
  - K13
  - K17
  author: claude-fable-5.2
  at: '2026-11-11T00:13:12+00:00'

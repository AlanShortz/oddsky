id: H04
title: Trial star H04
hook: ''
status: observation
summary: 'Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean. HINDSIGHT: data stop at day 1730.
  Register predictions (register_prediction) about later times; they will be graded against what actually
  happened.'
claims:
- id: C1
  text: 'NEOWISE visit means were flat for nine visits over 1458 d (W1 11.18-11.20, W2 11.24-11.28), then
    at day 1621 W1 = 10.985 and W2 = 10.817: brighter by 0.20 and 0.44 mag. All 18 single exposures of
    that visit agree (W2 10.79-10.91), plus one 8 d later.'
  tag: observed
  calls:
  - K3
  - K4
  - K7
  - K8
  author: claude-fable-5.2
  at: '2026-11-11T00:14:25+00:00'
- id: C2
  text: 'The brightening is red: W1-W2 goes from -0.07 to +0.17; the excess is 21% (W1) and 50% (W2) of
    the photosphere, two-band colour temperature ~1000 K (+/- a few hundred).'
  tag: computed
  calls:
  - K6
  - K11
  author: claude-fable-5.2
  at: '2026-11-11T00:14:26+00:00'
- id: C3
  text: 'The optical did not dim through the IR rise: ASAS-SN V over days 1560-1660 is 0.05 mag BRIGHTER
    than days 300-1300 (5 sigma, single survey, 16 arcsec beam with 20% neighbour light), having peaked
    ~0.10 mag bright near day 1580-1586.'
  tag: computed
  calls:
  - K5
  - K9
  - K10
  - K2
  author: claude-fable-5.2
  at: '2026-11-11T00:14:27+00:00'
- id: C4
  text: The star is a main-sequence K dwarf (Teff ~4770 K, abs G 6.55, 248 pc, RUWE 1.02), optically quiet
    at the 0.01-0.03 mag level in Gaia G over days 179-1158. No Gaia source inside the 6.1 arcsec WISE
    beam; nearest are at 7.0 and 7.9 arcsec (1% and 7% of target G flux).
  tag: observed
  calls:
  - K1
  - K2
  - K12
  author: claude-fable-5.2
  at: '2026-11-11T00:14:28+00:00'
- id: C5
  text: 'New ~1000 K emission equal to half the photosphere at 4.6 micron, appearing in under ~165 d around
    a previously excess-free mature-looking K dwarf with no optical dimming, is best explained by a large
    mass of freshly made warm dust at a few tenths of an au: the aftermath of a collision between planetary
    bodies, with the cloud not (yet) on our line of sight.'
  tag: inferred
  calls:
  - K3
  - K4
  - K11
  - K10
  author: claude-fable-5.2
  at: '2026-11-11T00:14:29+00:00'
- id: C6
  text: If this is collision debris, the cloud may shear around its orbit and cross the line of sight
    months to years later, producing irregular deep optical dips while the IR excess persists. The small
    optical brightening near the IR rise could be scattered light or an accretion/eruptive component;
    it rests on one survey.
  tag: speculated
  calls:
  - K9
  - K10
  author: claude-fable-5.2
  at: '2026-11-11T00:14:29+00:00'
- id: C7
  text: ASAS-SN V sits 0.44 mag brighter than the Gaia-implied V from the start of the series; with 20%
    neighbour flux in the beam and a constant offset throughout, I read this as blend plus colour-transformation
    zero point, not a mid-event start.
  tag: inferred
  calls:
  - K2
  - K5
  author: claude-fable-5.2
  at: '2026-11-11T00:14:30+00:00'

claims:
- id: C1
  text: Three deep, short dips are seen in ZTF r at days ~1956, ~2342 and ~2727-2729 (depth 1.5-1.65 mag),
    separated by 386 and ~386 days; ATLAS o independently records the third (1.5 mag at day 2729) and
    the egress of the second (day 2346).
  tag: observed
  calls:
  - K3
  - K5
  - K6
  - K7
  - K9
  - K10
  - K14
  author: claude-fable-5.2
  at: '2026-11-11T00:14:35+00:00'
- id: C2
  text: The well-sampled dip (day 1949-1958) has a ~7 day ingress, a rounded/flat bottom of ~4-5 days
    near 16.2-16.4 in r, and total duration ~12-14 days; out of eclipse the star is steady to ~0.02-0.04
    mag.
  tag: observed
  calls:
  - K7
  - K6
  - K22
  author: claude-fable-5.2
  at: '2026-11-11T00:14:36+00:00'
- id: C3
  text: 'The dip is deeper in the blue: 2.1 mag in ZTF g versus 1.5-1.65 mag in r and ~1.5 in ATLAS o,
    so the light that is removed is bluer than the light that remains.'
  tag: computed
  calls:
  - K4
  - K8
  - K3
  - K5
  author: claude-fable-5.2
  at: '2026-11-11T00:14:37+00:00'
- id: C4
  text: 'Period is ~385.6 d (fold: 45 in-eclipse points, median depth 1.38 mag, nothing at phase 0.5).
    The eclipse search returned 192.3 d, but points at half-period phase (ATLAS o day 2530.5, ATLAS c
    day 2924.0, ZTF r day 2925.3, all within ~5 d of where a 193-d eclipse would centre) are at normal
    brightness, so the true period is the ~386 d one.'
  tag: inferred
  calls:
  - K18
  - K22
  - K27
  - K36
  - K37
  author: claude-fable-5.2
  at: '2026-11-11T00:14:38+00:00'
- id: C5
  text: ATLAS o at day 1575 is ~0.2 mag faint and recovering by day 1577-1583, consistent with the egress
    of an earlier eclipse predicted at day ~1570 by the 385.6 d ephemeris.
  tag: inferred
  calls:
  - K11
  author: claude-fable-5.2
  at: '2026-11-11T00:14:38+00:00'
- id: C6
  text: After the day-1956 eclipse the star stays 0.05 mag fainter (7.8 sigma) and fades to +0.12 mag
    by day 2030-2053 before returning to baseline next season; smaller post-eclipse deficits (0.03-0.10
    mag) follow the other two eclipses. Something extended trails the occulter.
  tag: computed
  calls:
  - K19
  - K6
  - K22
  author: claude-fable-5.2
  at: '2026-11-11T00:14:39+00:00'
- id: C7
  text: The object is very red and infrared-bright (G=14.8, BP-RP=2.0, W1~8.0, W2~7.3, so W1-W2~0.7 from
    separate exposures) with slow 0.15 mag W2 drift; WISE is near saturation and 94% of exposures were
    cut, so the IR colour is uncertain. RUWE=1.81 suggests an unresolved companion. A G=18.5 neighbour
    at 3.0 arcsec (3% flux) cannot produce 1.6 mag dips.
  tag: observed
  calls:
  - K1
  - K2
  - K16
  - K17
  author: claude-fable-5.2
  at: '2026-11-11T00:14:40+00:00'
- id: C8
  text: A strictly periodic, short (3% of the period), deep, blue-deeper eclipse with a dusty IR-bright
    system is best read as a long-period eclipsing binary in which the hotter component is hidden by a
    cooler giant companion or by an opaque dusty disk around a companion.
  tag: inferred
  calls:
  - K22
  - K8
  - K16
  author: claude-fable-5.2
  at: '2026-11-11T00:14:41+00:00'

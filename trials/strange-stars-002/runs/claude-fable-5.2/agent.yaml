  before the interruption are kept in H03-interrupted/. Other self-reported deviations: output trimmed with
  tr, head, cut, grep and sed, and shell loops for repeated calls, no analysis scripts; T02's confidences sum
  to 0.97 because one hypothesis call was refused. Tool problem: lens_fit and eclipse_period reject a series
  given as a plain string; Fable found the list form on T01, T03 and H02 but not on H01, where it ran no lens
  fit. Recognised (self-reported): none of the scored stars. It thought H04, an open-question packet, was
  possibly ASASSN-21qj and says that coloured its forecast probabilities there. It is not that star.

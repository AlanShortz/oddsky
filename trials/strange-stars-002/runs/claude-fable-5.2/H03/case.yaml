claims:
- id: C1
  text: 'Gaia context: solar-type dwarf, Teff about 6000 K, absolute G 4.3, 426 pc, RUWE 1.15, not flagged
    as non-single.'
  tag: observed
  calls:
  - K2
  author: claude-fable-5-2
  at: '2026-11-11T00:14:33+00:00'
- id: C2
  text: 'ASAS-SN V is flat at 12.70 (robust scatter 0.015 mag) from day 45 to day 1082 with no excursions
    found, then 12.82 on day 1084.8 and 15.46 on day 1090.8: a 2.8 mag fade in six days.'
  tag: observed
  calls:
  - K2
  - K5
  - K15
  author: claude-fable-5-2
  at: '2026-11-11T00:14:34+00:00'
- id: C3
  text: 'NEOWISE single exposures catch the ingress: W1 falls 12.20 to 14.71 and W2 11.50 to 13.12 between
    days 1093.3 and 1094.3, against baselines of 11.06 and 11.10. Six earlier visits (days 0-901) are
    constant with photospheric W1-W2 about -0.03, so there is no infrared brightening before the fade.'
  tag: observed
  calls:
  - K6
  - K9
  - K10
  - K16
  author: claude-fable-5-2
  at: '2026-11-11T00:14:35+00:00'
- id: C4
  text: 'The infrared fade is larger in W1 than in W2: 3.65 vs 2.03 mag at day 1094.3 (ratio 1.8), and
    1.14 vs 0.40 at day 1093.3. Both bands fade, so the red W1-W2 colour is extinction, not added warm
    emission (the wise_color reading of warm dust does not apply).'
  tag: computed
  calls:
  - K6
  - K9
  - K10
  - K16
  author: claude-fable-5-2
  at: '2026-11-11T00:14:36+00:00'
- id: C5
  text: 'The star stays 5.5-6 mag down for at least 75 days: ATLAS o about 18.0 on days 1109-1165 (12.33
    on day 731), ATLAS c 18.3-18.8 on days 1149-1157, SkyMapper v 19.1-19.7 on day 1152 (13.71 on days
    127-135).'
  tag: observed
  calls:
  - K3
  - K4
  - K11
  - K12
  author: claude-fable-5-2
  at: '2026-11-11T00:14:36+00:00'
- id: C6
  text: 'The fade is real and on the target: ASAS-SN, ATLAS, SkyMapper and WISE all see it, and the Gaia
    neighbours inside each beam total under 1 percent of the target flux (brightest 0.2 percent at 4.4
    arcsec). Skeptic: 0 fail, 2 warn (period aliases only).'
  tag: inferred
  calls:
  - K13
  - K14
  author: claude-fable-5-2
  at: '2026-11-11T00:14:37+00:00'
- id: C7
  text: The neighbours inside the 8 arcsec ATLAS beam total 0.63 percent of the target G flux, about G
    18.0, which matches the ATLAS floor. The floor may therefore be neighbour light, and the target itself
    may be fainter still (occultation close to total).
  tag: inferred
  calls:
  - K13
  - K14
  - K3
  author: claude-fable-5-2
  at: '2026-11-11T00:14:38+00:00'
- id: C8
  text: 'Weak recovery hint: ATLAS c is 0.40 mag brighter on day 1157 than on days 1149-1153 (3.7 sigma)
    and ATLAS o 0.29 mag brighter on days 1161-1165 than on days 1109-1145 (1.6 sigma). If the floor is
    neighbour light this could be seeing-dependent contamination rather than egress.'
  tag: computed
  calls:
  - K7
  - K8
  author: claude-fable-5-2
  at: '2026-11-11T00:14:39+00:00'
- id: C9
  text: A W1/W2 extinction ratio near 1.8 is what small interstellar-like grains give; an opaque screen
    of large grains would be grey. With A_W1 of 3.65 mag the optical extinction would be tens of magnitudes,
    so the occulter is extremely optically thick and has a steep edge (column rising from A_V about 0.1
    to total in ten days).
  tag: inferred
  calls:
  - K5
  - K6
  - K9
  author: claude-fable-5-2
  at: '2026-11-11T00:14:40+00:00'

  text: No Gaia neighbour within 9.7 arcsec, all skeptic blend/saturation checks pass, RUWE 1.00; three
    independent instruments (ATLAS, ZTF, WISE) saw the event, so it is not an artifact or a neighbour.
  tag: inferred
  calls:
  - K2
  - K14
  author: claude-fable-5.2

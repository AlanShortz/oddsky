- id: C2
  text: 'A single brightening: ATLAS o is 0.97 mag above baseline at day 1977 (first point after a seasonal
    gap from day 1858) and declines smoothly and monotonically back to baseline by about day 2200; ATLAS
    c, ZTF g and r show the same decline. The peak itself fell in the gap.'
  tag: observed
  calls:
  - K5
  - K6
  - K9
  - K10
  - K11
  - K12
  author: claude-fable-5.2

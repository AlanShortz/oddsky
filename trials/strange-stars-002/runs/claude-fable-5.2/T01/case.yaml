- id: C1
  text: 'For ~1850 days before and ~2200 days after one event the star is constant: ZTF g/r robust scatter
    0.010-0.014 mag, ATLAS o median identical before (d300-1850) and after (d2400-4400) to 0.002 mag,
    no excursions after day 2300.'
  tag: computed
  calls:

- id: C3
  text: The NEOWISE visit at day 2006 is brighter by 0.74 mag in W1 and 0.73 mag in W2, matching ATLAS
    o (0.75 mag brighter) at the same date; W1-W2 colour at that visit (-0.078) equals the median (-0.078).
    No warm-dust colour change.
  tag: computed
  calls:
  - K3
  - K4
  - K9
  - K15
  - K21
  author: claude-fable-5.2
  at: '2026-11-11T00:10:50+00:00'
- id: C4
  text: 'The last pre-gap points hint the rise had begun: ZTF r at days 1844-1849 is 0.035 mag brighter
    than its baseline (3.9 sigma), ZTF g ~0.02-0.03 brighter.'
  tag: computed
  calls:
  - K17
  - K11
  - K12
  author: claude-fable-5.2
  at: '2026-11-11T00:10:54+00:00'
- id: C5
  text: 'One point-source point-lens curve fits ATLAS o+c, ZTF g+r and W1 jointly with chi2/dof = 366/389:
    t0 ~ day 1987, tE ~ 94 d (82-106), u0 ~ 0.17, with a similar blended source fraction (0.28-0.38) in
    all five bands, i.e. the event is achromatic from g to 4.6 micron. ATLAS c vs o slope during the decline
    is 1.10 (r=0.97).'
  tag: computed
  calls:
  - K23
  - K22
  - K18
  author: claude-fable-5.2
  at: '2026-11-11T00:10:57+00:00'

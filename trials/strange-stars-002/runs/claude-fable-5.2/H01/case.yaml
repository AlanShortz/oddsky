claims:
- id: C1
  text: 'Very red (BP-RP 3.15), faint (G 17.0) star with no measurable parallax in a crowded field (44
    Gaia sources within 30 arcsec; a neighbour with 37% of its G flux at 6.1 arcsec sits in the ATLAS
    and WISE beams): a distant reddened giant-like source, with blending diluting any amplitude.'
  tag: observed
  calls:
  - K1
  - K15
  author: claude-fable-5.2
  at: '2026-11-11T00:13:22+00:00'
- id: C2
  text: 'ATLAS o was near 16.95 from day ~2200 to ~2800, then brightened smoothly and at an accelerating
    rate: 16.85 (day 2915), 16.66 (2985), 16.36 (3027), still rising ~0.012 mag/day at the cutoff. No
    earlier excursion in 2500 days.'
  tag: observed
  calls:
  - K10
  - K12
  - K16
  author: claude-fable-5.2
  at: '2026-11-11T00:13:23+00:00'
- id: C3
  text: 'The rise is seen independently in ATLAS c (-0.38+/-0.04 mag at days 2960-3000 vs 2500-2800, against
    -0.29 in o), in ZTF r (16.95 at day 3009 vs 17.39 near day 1860) and in NEOWISE W1 (-0.15 mag, 10
    sigma, at day 2917): real, and broad-band from 0.5 to 4.6 micron.'
  tag: computed
  calls:
  - K14
  - K18
  - K19
  - K20
  author: claude-fable-5.2
  at: '2026-11-11T00:13:23+00:00'
- id: C4
  text: 'W1-W2 stays near -0.16 throughout including the last brightened visit: no warm dust and no IR
    colour change during the rise.'
  tag: computed
  calls:
  - K21
  author: claude-fable-5.2
  at: '2026-11-11T00:13:24+00:00'
- id: C5
  text: Before the event ATLAS o and c brightened slowly by ~0.2-0.3 mag between days ~500 and ~2200;
    this may be an early-ATLAS systematic in a crowded field, intrinsic slow variability, or the far wing
    of a very long event.
  tag: observed
  calls:
  - K9
  - K10
  - K11
  author: claude-fable-5.2
  at: '2026-11-11T00:13:25+00:00'
- id: C6
  text: A single smooth, accelerating, nearly achromatic brightening of a previously quiet distant star
    in a crowded field is best explained as a microlensing event in progress; the slightly larger blue
    amplitude is as expected if redder neighbours dilute the o band more, but an outburst (hotter when
    brighter) is not excluded.
  tag: inferred
  calls:
  - K16
  - K18
  - K19
  - K20
  - K21
  author: claude-fable-5.2
  at: '2026-11-11T00:13:26+00:00'
- id: C7
  text: lens_fit could not be run (tool error), so no Einstein time or peak date is computed; the forecast
    peak is a judgement from the rise shape only.
  tag: observed
  calls:
  - K16
  author: claude-fable-5.2
  at: '2026-11-11T00:13:27+00:00'
hypotheses:

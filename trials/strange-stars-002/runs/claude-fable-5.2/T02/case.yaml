summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: 'Gaia context: Teff~5270 K, abs G~4.6 at 389 pc, RUWE 0.99, no neighbour contributing more than
    0.8% of flux within 42 arcsec; the variability belongs to the target.'
  tag: observed
  calls:
  - K1
  - K2
  - K13
  author: claude-fable-5.2
  at: '2026-11-11T00:10:10+00:00'
- id: C2
  text: Gaia G shows irregular fadings of 0.2-1.2 mag from a bright level near 12.38-12.5 (e.g. 13.66
    at day 1069.6, back to 12.59 by day 1120), with intra-day changes of 0.05-0.15 mag; distribution strongly
    skewed to faint (skewness 3.0).
  tag: observed
  calls:
  - K1
  - K8
  author: claude-fable-5.2
  at: '2026-11-11T00:10:11+00:00'
- id: C3
  text: 'Gaia BP and RP fade together (r=0.996) with dBP/dRP=1.32: the star reddens when it fades, as
    for extinction by dust (somewhat greyer than ISM).'
  tag: computed
  calls:
  - K11
  author: claude-fable-5.2
  at: '2026-11-11T00:10:12+00:00'
- id: C4
  text: 'ZTF g, years later, shows the same behaviour: dips of 0.3-0.9 mag lasting a few days recurring
    every ~1-3 weeks without a stable period (best >1.5 d peak 15.1 d, FAP 0.05; no significant periodicity).'
  tag: computed
  calls:
  - K3
  - K18
  - K19
  author: claude-fable-5.2
  at: '2026-11-11T00:10:13+00:00'
- id: C5
  text: 'TESS resolves the dips: asymmetric fadings of 0.3-0.65 mag lasting 1-3 days in both sectors,
    aperiodic/quasi-periodic (weak peaks at 2.2 and ~5.7 d), on a flat-topped bright state.'
  tag: observed
  calls:
  - K9
  - K15
  - K17
  author: claude-fable-5.2
  at: '2026-11-11T00:10:15+00:00'
- id: C6
  text: 'NEOWISE W1-W2 is ~0.43 at every visit over 10 years: a persistent warm-dust infrared excess (inner
    disk). W1 varies by 0.5 mag irregularly with no secular trend.'
  tag: computed
  calls:
  - K7
  - K14
  author: claude-fable-5.2
  at: '2026-11-11T00:10:17+00:00'
- id: C7
  text: The very narrow (0.04-0.1 d), very deep (0.7-2.7 mag) TESS spikes, e.g. at day 2089.47, sit on
    top of real dips but are too short and sharp for the dust events seen elsewhere; many TESS points
    are flagged, so these are probably instrumental (scattered light/background or a passing asteroid
    in the aperture) and I do not rely on them.
  tag: inferred
  calls:
  - K10
  - K16
  - K1
  author: claude-fable-5.2
  at: '2026-11-11T00:10:19+00:00'
- id: C8
  text: A solar-type star with persistent warm IR excess and aperiodic, reddening, day-long dips over
    >10 years is a young disk-bearing star seen at high inclination whose inner disk (warp/accretion streams)
    intermittently occults it.
  tag: inferred
  calls:
  - K7
  - K11
  - K15
  - K19
  author: claude-fable-5.2
  at: '2026-11-11T00:10:21+00:00'
hypotheses:
- id: H1
  klass: yso_dipper
  statement: Young disk-bearing (T Tauri / UX Ori-like) star seen near edge-on; inner-disk dust intermittently
    occults it, giving aperiodic reddening dips of days duration.
  supports:
  - C2
  - C3
  - C4
  - C5
  - C6
  - C8
  conflicts: []
  would_falsify: A spectrum with no youth indicators (no Li, no H-alpha emission) and an old kinematic

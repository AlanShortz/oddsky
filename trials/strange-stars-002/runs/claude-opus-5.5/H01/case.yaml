id: H01
title: Trial star H01
hook: ''
status: observation
summary: 'Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean. HINDSIGHT: data stop at day 3033.
  Register predictions (register_prediction) about later times; they will be graded against what actually
  happened.'
claims:
- id: C1
  text: 'ATLAS o is quiet near 16.93-17.00 (10-d bins) over days 2200-2800, then brightens smoothly and
    with accelerating rate: 16.84 (day ~2915), 16.74 (~2953), 16.66 (~2984), 16.55 (~3005), 16.36 at the
    cutoff (day 3028). The rise is still steepening when the data stop.'
  tag: observed
  calls:
  - K4
  - K5
  author: claude-opus-5.5
  at: '2026-11-11T00:09:19+00:00'
- id: C2
  text: 'The brightening is near-achromatic: day 2990-3033 vs 2200-2800, ATLAS o -0.45 mag and ATLAS c
    -0.49 mag; at day ~2917, ATLAS o -0.115 mag, NEOWISE W1 -0.153 (11 sigma), W2 -0.138 (6.7 sigma).
    ZTF r independently confirms: 17.37-17.40 (days 1851-1876) vs 16.95 (day 3009).'
  tag: computed
  calls:
  - K15
  - K16
  - K17
  - K18
  - K19
  - K7
  author: claude-opus-5.5
  at: '2026-11-11T00:09:20+00:00'
- id: C3
  text: 'Point-lens fits are unconstrained because no peak or decline is observed: unblended fit gives
    t0 ~3150 (95%: 3106-3184), tE ~190 d with u0 at the grid edge; blended o+c fit gives t0 ~3069 (3040-3089),
    tE open-ended 570-2240 d, source fraction ~0.02. Both place the peak after the cutoff.'
  tag: computed
  calls:
  - K11
  - K12
  author: claude-opus-5.5
  at: '2026-11-11T00:09:21+00:00'
- id: C4
  text: 'Crowded field: 44 Gaia sources within 30"; a G=18.1 neighbour (37% of target flux) at 6.1" sits
    inside the ATLAS (8") and WISE beams; negative parallax and BP-RP 3.15 imply a distant, heavily reddened
    star, likely in a dense Galactic field. ZTF (2" beam, no neighbour) also shows the brightening, so
    it belongs to the target or a <2" companion.'
  tag: computed
  calls:
  - K2
  - K10
  - K1
  - K7
  author: claude-opus-5.5
  at: '2026-11-11T00:09:22+00:00'
- id: C5
  text: 'Earlier history is not flat: ATLAS o drifts from ~17.2 (days 500-900) to ~16.95 (day 2000+) and
    periodogram shows weak 427/321 d power, so the star (or calibration in a crowded field) has low-level
    long-term variability; this weakens but does not exclude microlensing, which predicts a flat baseline.'
  tag: inferred
  calls:
  - K4
  - K3
  - K14
  author: claude-opus-5.5
  at: '2026-11-11T00:09:23+00:00'
- id: C6
  text: An achromatic, smooth, accelerating rise in a dense, reddened field with no prior comparable event
    is the textbook signature of a microlensing event caught on the rise; a YSO/EXor outburst or a giant
    LPV/symbiotic brightening would usually be strongly chromatic.
  tag: speculated
  calls:
  - K9
  - K15
  - K17
  author: claude-opus-5.5
  at: '2026-11-11T00:09:24+00:00'

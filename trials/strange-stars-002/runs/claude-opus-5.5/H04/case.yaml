id: H04
title: Trial star H04
hook: ''
status: observation
summary: 'Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean. HINDSIGHT: data stop at day 1730.
  Register predictions (register_prediction) about later times; they will be graded against what actually
  happened.'
claims:
- id: C1
  text: NEOWISE W1 and W2 are flat (W1 11.18-11.20, W2 11.24-11.28) for nine visits from day 0 to day
    1458, then at day 1621 jump brighter by 0.20 mag (W1) and 0.44 mag (W2).
  tag: observed
  calls:
  - K3
  - K4
  author: claude-opus-5.5
  at: '2026-11-11T00:09:40+00:00'
- id: C2
  text: The day-1621 brightening is present in every single exposure of the visit (19 W1, 18 W2 exposures
    over ~9 days, W2 10.79-10.91 vs 11.18-11.32 one visit earlier), so it is not a single bad frame or
    passing asteroid.
  tag: observed
  calls:
  - K6
  - K7
  author: claude-opus-5.5
  at: '2026-11-11T00:09:42+00:00'
- id: C3
  text: 'The IR brightening is red: W1-W2 goes from -0.07 (photospheric, stable for 8 visits) to +0.17;
    the excess is 21% of the photosphere in W1 and 50% in W2, with a two-band colour temperature ~1000
    K, i.e. warm dust appearing near the star.'
  tag: computed
  calls:
  - K5
  - K8
  author: claude-opus-5.5
  at: '2026-11-11T00:09:43+00:00'
- id: C4
  text: 'Optical V shows no dimming up to day 1658 (last ASAS-SN point): no excursions at 3 sigma; the
    last 180 days are if anything 0.05 mag brighter than before (5 sigma, possibly calibration/seasonal).
    Gaia G was flat to 0.01 mag (days 179-1158).'
  tag: computed
  calls:
  - K9
  - K10
  - K11
  - K14
  - K1
  author: claude-opus-5.5
  at: '2026-11-11T00:09:44+00:00'
- id: C5
  text: Host is a main-sequence K dwarf (Teff ~4770 K, M_G 6.55 at 248 pc, RUWE 1.02). No Gaia source
    within 6.1 arcsec; nearest are G=18.5 at 7.0 arcsec (1% flux) and G=16.4 at 7.9 arcsec (7%), partly
    inside the WISE PSF.
  tag: observed
  calls:
  - K1
  - K13
  author: claude-opus-5.5
  at: '2026-11-11T00:09:45+00:00'
- id: C6
  text: A sudden ~1000 K IR excess on a previously photospheric main-sequence K dwarf, with no optical
    change yet, matches the pattern expected for a fresh collisional debris cloud (IR first, possible
    optical extinction later as the cloud transits); it is not what a YSO, AGB or pulsating star does
    from a long flat photospheric state.
  tag: inferred
  calls:
  - K5
  - K8
  - K11
  author: claude-opus-5.5
  at: '2026-11-11T00:09:46+00:00'
- id: C7
  text: The ASAS-SN vs Gaia V offset flagged by the Skeptic (-0.44 mag) is more plausibly a photometric-system/blend
    offset (three neighbours inside the 16 arcsec ASAS-SN beam, ~20% of G flux) than a real event, since
    ASAS-SN itself is flat for 4 years.
  tag: inferred
  calls:
  - K2
  - K9
  author: claude-opus-5.5
  at: '2026-11-11T00:09:47+00:00'
hypotheses:
- id: H1
  klass: collision_debris
  statement: A planetary-scale collision produced a warm (~1000 K) dust cloud around the K dwarf, seen
    first as an IR excess at day 1621; optical dimming may follow when the debris crosses the line of
    sight.
  supports:
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  conflicts: []
  would_falsify: IR excess vanishing at the very next NEOWISE visit with no decay; the excess traced to
    the 7.9 arcsec neighbour; or a periodic/recurrent IR pattern typical of a YSO.
  status: live
  confidence: 0.55
  author: claude-opus-5.5
  at: '2026-11-11T00:10:02+00:00'
- id: H2

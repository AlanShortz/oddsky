  tag: computed
  calls:
  - K1
  - K2
  - K14
  author: claude-opus-5.5
  at: '2026-11-11T00:09:52+00:00'
- id: C5
  text: 'Not a blend: no Gaia source in the 2 arcsec ZTF beam; the only source within 8 arcsec contributes
    3.3% of G flux, far too little to produce 75% dimming. RUWE 1.81 hints at an unresolved companion
    or photocentre motion.'

  text: 'Strong infrared excess / heavy reddening: NEOWISE W1~8.0, W2~7.3 against Gaia G=14.76 (G-W1 ~6.7,
    W1-W2 ~0.7); NEOWISE photometry is near saturation and 94% of exposures fail quality cuts, so WISE

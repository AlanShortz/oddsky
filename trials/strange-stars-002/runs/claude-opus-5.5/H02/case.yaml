hypotheses:
- id: H1
  klass: eclipse_companion
  statement: 'A long-period (P~387 d) eclipsing binary: a hotter component is eclipsed for ~2 weeks each
    orbit by a cool, IR-bright companion (possibly with circumstellar dust), giving deep blue-deeper eclipses
    and no detectable secondary.'
  supports:
  - C1
  - C2
  - C3
  - C5
  - C6
  conflicts: []
  would_falsify: No eclipse in the predicted window ~day 3106-3120 (and ~3490-3515) when the star is observed;
    eclipses drifting in phase or changing depth/duration erratically; a grey (achromatic) eclipse would
    argue for dust rather than a stellar eclipser.
  status: live
  confidence: 0.76
  author: claude-opus-5.5
  at: '2026-11-11T00:10:10+00:00'
- id: H2
  klass: yso_dipper
  statement: A young star with a warped/precessing inner disk producing periodic extinction dips (KH 15D-like),
    consistent with the IR excess.
  supports:
  - C1
  - C2
  - C4
  conflicts:
  - C6
  would_falsify: Dips that are perfectly repeatable in shape and depth over many cycles favour a stellar
    eclipse; a dip deepening/evolving cycle to cycle or non-strict timing would favour this.
  status: live
  confidence: 0.08
  author: claude-opus-5.5
  at: '2026-11-11T00:10:12+00:00'
- id: H3
  klass: dust_occultation
  statement: A dust clump or disk orbiting with the binary/star occults it once per 387 d orbit.
  supports:

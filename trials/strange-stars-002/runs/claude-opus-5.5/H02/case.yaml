- id: C2
  text: 'The fadings are strictly periodic: eclipse_period across ZTF r/g and ATLAS o gives P=387.3 d
    (score 0.89, 92% of dim points within 0.04 phase, <1% of quiet points in the core, 4 cycles sampled);
    fold shows primary depth 1.38 mag (median) and no secondary at phase 0.5 (0.008+-0.017 mag).'
  tag: computed
  calls:
  - K8
  - K9
  author: claude-opus-5.5
  at: '2026-11-11T00:09:50+00:00'
- id: C3
  text: 'The eclipse is chromatic, deeper in the blue: ZTF g fell ~2.05 mag (to 18.07) vs ~1.5 mag in

id: T02
title: Trial star T02
hook: ''
status: observation
summary: Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean.
claims:
- id: C1
  text: ZTF g shows a bright ceiling near 13.0-13.1 mag with frequent, irregular, short fadings of 0.3-1.1
    mag lasting days; no outbursts above the ceiling. Gaia G skewness +3.0 (dip-dominated).
  tag: observed
  calls:
  - K11
  - K3
  - K1
  author: claude-opus-5.5
  at: '2026-11-11T00:07:11+00:00'
- id: C2
  text: 'TESS resolves individual dips: 2.57 mag deep over 0.69 d (day ~2089), 1.33 mag over 0.19 d (day
    ~3936), several ~0.8-1.0 mag dips of 0.06-0.1 d; Skeptic finds only 1 of 7 TESS dips near a momentum
    dump/edge, so they are not spacecraft systematics.'
  tag: computed
  calls:
  - K12
  - K14
  - K2
  author: claude-opus-5.5
  at: '2026-11-11T00:07:12+00:00'
- id: C3
  text: 'Fadings are reddening: Gaia dBP/dRP = 1.32 (r=0.996, 34 pairs), ZTF dg/di = 1.48 (r=0.999, 5
    pairs) vs ISM expectation 1.98 -> extinction by dust somewhat greyer than ISM (grain growth).'
  tag: computed
  calls:
  - K15
  - K16
  author: claude-opus-5.5
  at: '2026-11-11T00:07:13+00:00'
- id: C4
  text: 'Strong infrared excess: W1-W2 median 0.43 for a Teff~5270 K photosphere (expected ~0.05); W1
    varies 0.5 mag and W1-W2 is redder when W1 is fainter (corr 0.76): hot inner-disk dust, itself variable.'
  tag: computed
  calls:
  - K9
  - K17
  - K1
  author: claude-opus-5.5
  at: '2026-11-11T00:07:16+00:00'
- id: C5
  text: 'No blend risk: no Gaia source within the WISE (6.1") or ZTF (2") beams; neighbours within 42"
    contribute 1.2% of flux, far too little for 2.5-mag TESS dips. RUWE 0.99.'
  tag: computed
  calls:
  - K2
  - K10
  author: claude-opus-5.5
  at: '2026-11-11T00:07:18+00:00'
- id: C6
  text: abs G 4.6 at Teff 5270 K is ~1 mag above a K-dwarf main sequence, consistent with a pre-main-sequence
    (T Tauri) star; together with a hot-dust excess and aperiodic, chromatic, hours-to-days dips this
    matches the YSO dipper phenomenon. TESS periodogram peaks (2.18, 5.5-6.2 d) are weak and broad, consistent
    with quasi-periodic inner-disk structure/rotation, not a strict eclipse.
  tag: inferred
  calls:
  - K1
  - K13
  - K12
  author: claude-opus-5.5
  at: '2026-11-11T00:07:19+00:00'

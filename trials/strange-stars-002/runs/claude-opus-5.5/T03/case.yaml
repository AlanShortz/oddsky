claims:
- id: C1
  text: Gaia G is flat at 14.15 (robust std 0.006) except two isolated deep points ~0.87 mag fainter (day
    360.43 and 872.17); 1.8 h after the first, G is still 0.19 mag faint, i.e. a short event of hours
    with ingress/egress.
  tag: observed
  calls:
  - K5
  author: claude-opus-5.5
  at: '2026-11-11T00:08:12+00:00'
- id: C2
  text: The deep points in ZTF r, ZTF g and Gaia G all fold to one phase at P = 2.38016 d (96% of 72 dim
    points within 0.04 phase, 1.2% of quiet points in core), across ~4000 days and 21 sampled cycles.
  tag: computed
  calls:
  - K8
  - K7
  author: claude-opus-5.5
  at: '2026-11-11T00:08:13+00:00'
- id: C3
  text: Folded at 2.38016 d, ZTF r primary eclipse reaches 0.92 mag with no detectable secondary at phase
    0.5 (0.007 +/- 0.004 mag); out-of-eclipse scatter is 0.012 mag.
  tag: computed
  calls:
  - K12
  author: claude-opus-5.5
  at: '2026-11-11T00:08:14+00:00'
- id: C4
  text: A primary depth of 0.92 mag exceeds the 0.75 mag maximum possible for two equal stars, so the
    4.76 d doubled period with twin eclipses is disfavoured; P = 2.38 d with a much fainter (cooler) companion
    is the natural reading. Gaia BP dims slightly more than RP (0.94 vs 0.83 mag), as expected when a
    cooler body covers a warmer star.
  tag: inferred
  calls:
  - K12
  - K13
  - K1
  author: claude-opus-5.5
  at: '2026-11-11T00:08:16+00:00'
- id: C5
  text: 'No extended dips or brightenings beyond the eclipses: running-baseline excursion search finds
    none in ZTF r or g, NEOWISE W1/W2 are flat to ~0.01 mag over 10 years, and no IR change; no Gaia neighbour
    inside the ZTF or NEOWISE beams, RUWE 1.05.'
  tag: computed
  calls:
  - K3
  - K4
  - K1
  - K2
  author: claude-opus-5.5
  at: '2026-11-11T00:08:17+00:00'

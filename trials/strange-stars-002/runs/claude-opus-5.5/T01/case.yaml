  at: '2026-11-11T00:07:56+00:00'
hypotheses:
- id: H1
  klass: microlensing
  statement: A single blended point-lens microlensing event peaking near day 1987 with tE~100 d; achromatic
    from g to W2 and fit well by a PSPL model.
  supports:
  - C1
  - C2
  - C3
  - C4
  - C5
  conflicts: []
  would_falsify: Any repeat brightening in later data; a significant colour change during the event (e.g.
    W1-W2 or g-r shifting); spectroscopy showing emission lines or a nova/accretion signature; strong
    deviation of the rise phase from PSPL symmetry.
  status: live
  confidence: 0.86
  author: claude-opus-5.5
  at: '2026-11-11T00:08:09+00:00'
- id: H2
  klass: eruptive
  statement: An intrinsic outburst (e.g. slow accretion or nova-like event) whose decline happened to
    be grey and smooth.
  supports:
  - C1
  conflicts:
  - C2
  - C3
  - C5
  would_falsify: Outbursts are usually bluer when brighter and show IR colour changes; achromaticity to
    W2 and PSPL fit already argue against it. A recurrence or emission lines would support it.
  status: live
  confidence: 0.06
  author: claude-opus-5.5
  at: '2026-11-11T00:08:10+00:00'

claims:
- id: C1
  text: 'A single brightening: ATLAS o is 0.95 mag above its 15.23 baseline at day 1977 (first point after
    a seasonal gap), then declines smoothly back to baseline by ~day 2200; find_excursions finds no other
    brightening in ATLAS o or c over ~4100 days.'
  tag: observed
  calls:
  - K10
  - K11
  - K12
  - K13
  author: claude-opus-5.5
  at: '2026-11-11T00:07:51+00:00'
- id: C2
  text: 'The event is achromatic from optical to mid-IR: NEOWISE W1 and W2 both brighten by ~0.77 mag
    at day 2006 with unchanged W1-W2 (-0.08), matching ATLAS o (~0.75 mag) at day 2005; ATLAS c vs o slope
    1.08, r=0.97; ZTF g and ATLAS o both ~0.13-0.14 mag above baseline near day 2075.'
  tag: computed
  calls:
  - K3
  - K4
  - K5
  - K7
  - K8
  - K10
  - K15
  - K16
  author: claude-opus-5.5
  at: '2026-11-11T00:07:52+00:00'
- id: C3
  text: 'A static point-source point-lens fit with blending across ATLAS o/c and ZTF g/r gives t0=1987
    (95%: 1986-1988), tE=102 d (89-116), u0=0.145, chi2/dof=330/384, with similar source fractions in
    all bands (0.25-0.35); the peak itself fell in the seasonal gap.'
  tag: computed
  calls:
  - K17
  author: claude-opus-5.5
  at: '2026-11-11T00:07:53+00:00'
- id: C4
  text: 'Not a blend: no Gaia source within the WISE (6.1 arcsec), ATLAS or ZTF beams; nearest neighbour
    is 4.5 mag fainter at 9.7 arcsec, far too faint to produce a 0.8 mag rise. RUWE=1.00.'
  tag: computed
  calls:
  - K2
  - K20
  author: claude-opus-5.5
  at: '2026-11-11T00:07:54+00:00'
- id: C5
  text: Baseline before (days 300-1860) and after (2400-4400) the event agree to 0.002 mag; star is otherwise
    quiet (ZTF r robust std 0.011 mag), Gaia Teff ~5800 K, W1-W2 ~ -0.08 (no warm dust). An achromatic,
    smooth, single, non-repeating rise on a quiet dust-free star points to microlensing rather than an
    outburst.
  tag: inferred
  calls:
  - K5
  - K6
  - K18
  - K1
  author: claude-opus-5.5
  at: '2026-11-11T00:07:55+00:00'
- id: C6
  text: Minor features (ATLAS o 0.14 mag dip days 378-386; ZTF r 0.07 mag dip days 2192-2206; 354 d and
    1133 d periods) are at the survey-window/noise level and are probably instrumental.
  tag: inferred
  calls:

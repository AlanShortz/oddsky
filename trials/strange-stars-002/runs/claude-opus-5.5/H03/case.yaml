id: H03
title: Trial star H03
hook: ''
status: observation
summary: 'Identity, coordinates and calendar dates are hidden; times are days since the first observation.
  Observers are pseudonymous. Gaia DR3 context is the 2014-2017 mean. HINDSIGHT: data stop at day 1168.
  Register predictions (register_prediction) about later times; they will be graded against what actually
  happened.'
claims:
- id: C1
  text: 'Gaia: G=12.46, BP-RP=0.80, Teff~6000 K, abs G=4.3 at 426 pc, RUWE 1.15, non_single_star=0: a
    single-looking F/G main-sequence (slightly evolved) dwarf, not a giant.'
  tag: observed
  calls:
  - K1
  author: claude-opus-5.5
  at: '2026-11-11T00:09:04+00:00'
- id: C2
  text: 'Before day ~1084 the star is flat: ASAS-SN V 12.70 with no excursions and no change between days
    40-400 and 700-1083 (-0.006 mag, 1.3 sigma); NEOWISE W1 flat at 11.06 for six visits; no IR excess
    (W1 +0.5%, W2 -2%) and W1-W2 ~ -0.01.'
  tag: computed
  calls:
  - K9
  - K12
  - K13
  - K17
  - K5
  - K6
  author: claude-opus-5.5
  at: '2026-11-11T00:09:06+00:00'
- id: C3
  text: 'A sudden deep dimming begins between day 1081.8 (V=12.69) and 1084.8 (V=12.82); V=15.46 at day
    1090.8; NEOWISE single exposures catch the ingress in the IR: W1 12.21->14.71 and W2 11.50->13.12
    between days 1093.3 and 1094.3 (baseline 11.06/11.09).'
  tag: observed
  calls:
  - K9
  - K10
  - K11
  author: claude-opus-5.5
  at: '2026-11-11T00:09:07+00:00'
- id: C4
  text: Four independent instruments (ASAS-SN, NEOWISE, ATLAS o and c, SkyMapper v) record the faint state;
    ATLAS o ~18.0 and c ~18.6 over days 1109-1165 (depth ~5.7-6.0 mag vs ATLAS baselines 12.33/12.63)
    and SkyMapper v 19.65 at day 1152 (depth ~5.9). Not an instrumental artifact.
  tag: observed
  calls:
  - K2
  - K3
  - K4
  - K7
  author: claude-opus-5.5
  at: '2026-11-11T00:09:08+00:00'
- id: C5
  text: 'The extinction is chromatic but far greyer than interstellar dust: during the IR ingress W1 fell
    3.6 mag and W2 2.0 mag while the optical eventually reached ~6 mag; ATLAS c (bluer) is only ~0.3 mag
    deeper than o. Implies an optically thick and/or large-grain occulter covering most of the star, not
    ISM-like small grains.'
  tag: inferred
  calls:
  - K3
  - K4
  - K10
  - K11
  author: claude-opus-5.5
  at: '2026-11-11T00:09:09+00:00'
- id: C6
  text: 'No IR excess before the event and no IR brightening as the event began (W1 and W2 both dim):
    no sign of warm dust emission from a newly made debris cloud or from the star making dust.'
  tag: computed
  calls:
  - K14
  - K17
  - K10
  - K11
  author: claude-opus-5.5
  at: '2026-11-11T00:09:11+00:00'
- id: C7
  text: Gaia neighbours at 4.4-7.5 arcsec (G 19.0-20.1) total ~0.6% of the target flux (combined G~18.0),
    comparable to the ATLAS faint-state level; the ATLAS ~18 floor and the 0.34 mag brightening at day
    1163 may be partly neighbour light, so the true depth may exceed 6 mag (SkyMapper v 19.65 supports
    this).
  tag: inferred
  calls:
  - K2
  - K15
  - K16
  - K7
  author: claude-opus-5.5
  at: '2026-11-11T00:09:12+00:00'
- id: C8
  text: The occulter is likely a large structure (disk around a companion or a massive dust clump) crossing
    the star; ingress ~1 week from onset to >3 mag sets the edge crossing time.
  tag: speculated
  calls:
  - K9
  - K10
  author: claude-opus-5.5
  at: '2026-11-11T00:09:13+00:00'
hypotheses:
- id: H1
  klass: eclipse_companion
  statement: A long-period companion surrounded by an opaque dusty disk passes in front of the star, producing
    a sudden, deep, nearly grey, months-long eclipse with a sharp ingress.
  supports:
  - C1
  - C2
  - C3
  - C4
  - C5
  - C8
  conflicts: []
  would_falsify: Rapid irregular recovery within weeks with large chromatic flicker; or no repeat and
    no RV/astrometric companion; or a slow, ragged egress inconsistent with a disk edge.
  status: live
  confidence: 0.45
  author: claude-opus-5.5
  at: '2026-11-11T00:09:25+00:00'
- id: H2
